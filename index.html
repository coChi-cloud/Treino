  const primeiro = `${y}-${pad2(mo)}-01`, off = (diaDaSemana(primeiro) + 6) % 7; // semana começa na segunda
  const nDias = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  let nF = 0, nC = 0;
  const cels = [];
  for (let i = 0; i < off; i++) cels.push(h('div', { class: 'cal-v' }));
  for (let d = 1; d <= nDias; d++) {
    const iso = `${y}-${pad2(mo)}-${pad2(d)}`, mk = marcas.get(iso) || new Set();
    if (mk.has('f')) nF++; if (mk.has('c')) nC++;
    const rot = `${NOMES_DIA[diaDaSemana(iso)]}, ${d} de ${NOMES_MES[mo - 1]}: ${mk.size ? [mk.has('f') ? 'academia' : '', mk.has('c') ? 'corrida' : ''].filter(Boolean).join(' e ') : 'sem treino'}`;
    cels.push(h('button', { type: 'button', class: 'cal-d' + (iso === (irHoje ? UI.histDia : UI.data) ? ' sel' : '') + (iso === hj ? ' hoje' : ''), 'aria-label': rot,
      onclick: () => {
        if (irHoje) { // no Histórico: fica no Histórico e mostra o treino daquele dia (1.7.3)
          UI.histDia = iso; UI.calMes = `${y}-${pad2(mo)}`; render();
          const alvo = document.querySelector(`#main [data-data="${iso}"]`);
          if (alvo) { alvo.scrollIntoView({ block: 'start', behavior: 'smooth' }); alvo.classList.add('realce'); setTimeout(() => alvo.classList.remove('realce'), 1600); }
          else toast('Sem treino registrado neste dia');
          return;
        }
        UI.data = iso; UI.dataManual = iso !== hj; UI.diaId = diaPadrao(iso); UI.calMes = null; render();
      } },
      h('span', null, String(d)),
      h('i', { class: 'pts' }, mk.has('f') && h('b', { class: 'pf' }), mk.has('c') && h('b', { class: 'pc' }))));
  }
  const mover = n => { const t = mo - 1 + n; UI.calMes = `${y + Math.floor(t / 12)}-${pad2(((t % 12) + 12) % 12 + 1)}`; render(); };
  return h('section', { class: 'card cal-card' },
    h('div', { class: 'cab' },
      h('button', { type: 'button', class: 'cal-nav', 'aria-label': 'Mês anterior', onclick: () => mover(-1) }, '‹'),
      h('b', null, `${cap(NOMES_MES[mo - 1])} de ${y}`),
      h('button', { type: 'button', class: 'cal-nav', 'aria-label': 'Próximo mês', onclick: () => mover(1) }, '›')),
    h('div', { class: 'cal-sem' }, ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map(l => h('span', null, l))),
    h('div', { class: 'cal-grade' }, cels),
    h('div', { class: 'cal-leg' }, h('span', null, h('b', { class: 'pf' }), `Academia ${nF}`), h('span', null, h('b', { class: 'pc' }), `Corrida ${nC}`)));
}
// TR-02: a semana anda pelo calendário; depois de uma pausa, oferece voltar para onde parou.
// M = semana do registro mais recente até a data da tela (o próprio dia conta, para o aviso sumir ao registrar).
function avisoPausaSemana(data, N, ehHoje) {
  if (UI.manterSemana) return null;
  const regs = S.registros.filter(r => typeof r.data === 'string' && RE_DATA.test(r.data) && r.data <= data && ehInt(r.semana));
  if (!regs.length) return null;
  const dUlt = regs.reduce((m, r) => (r.data > m ? r.data : m), '');
  const M = Math.max(...regs.filter(r => r.data === dUlt).map(r => r.semana));
  if (!(N > M + 1)) return null;
  const A = diasEntre(dUlt, data) > 28 ? M : M + 1;
  return h('div', { class: 'aviso info' },
    `Último treino registrado: semana ${M} (${fmtData(dUlt).slice(0, 5)}). Pela data, hoje seria a semana ${N}.`,
    ehHoje && h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'btn-pri', onclick: () => { definirSemana(A); toast(`Semana ${A}`); render(); } }, `Continuar da semana ${A}`),
      h('button', { type: 'button', onclick: () => { UI.manterSemana = true; render(); } }, `Manter semana ${N}`)));
}

// Último dia com pelo menos uma série registrada daquele treino (sai dos registros, sem campo novo)
function ultimaExecucao(diaId) {
  return S.registros.reduce((m, r) => (r.dia === diaId && typeof r.data === 'string' && r.data > m ? r.data : m), '') || null;
}

function cardInicio() {
  const sugerida = proximaData(idxDiaSemana(diasDoPlano()[0].dia_semana), hoje());
  const inp = h('input', { type: 'date', value: sugerida, 'aria-label': 'Data de início do plano' });
  return h('section', { class: 'card destaque' },
    h('h2', null, 'Quando começa o plano?'),
    h('p', { class: 'muted' }, 'Com a data de início o app sugere a semana sozinho. Dá para mudar depois em Ajustes.'),
    inp,
    h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'btn-pri', onclick: () => {
        if (!RE_DATA.test(inp.value)) return toast('Escolha uma data.', 'erro');
        definirInicio(inp.value); toast(`Início do plano: ${fmtData(inp.value)}`); render();
      } }, 'Confirmar'),
      h('button', { type: 'button', onclick: () => { S.config.inicio_adiado = true; salvarConfig(); render(); } }, 'Agora não')));
}

function cardExercicio(x, dia, data, semana) {
  const regs = S.registros.filter(r => r.data === data && r.dia === dia.id && r.exercicio === x.id);
  const nLinhas = Math.max(x.series, ...regs.map(r => r.serie));
  const ehTempo = x.tipo === 'tempo';
  const feitasNoPlano = new Set(regs.filter(r => r.serie <= x.series).map(r => r.serie)).size;
  const concluido = feitasNoPlano >= x.series;
  const meta = ehTempo
    ? `${x.series} × ${fmtFaixa(x.duracao_s)} s`
    : `${x.series} × ${fmtFaixa(x.reps)} reps${x.por_perna ? ' por perna' : ''}`;

  const gEx = gruposDe(x);
  const semKg = x.com_carga === false; // 1.3.3: peso do corpo → sem coluna de kg
  const card = h('section', { class: 'card ex' + (concluido ? ' concluido' : '') + (semKg ? ' sem-kg' : '') },
    h('div', { class: 'ex-cab' }, h('h3', null, x.nome), concluido && h('span', { class: 'tag ok' }, 'feito')),
    h('p', { class: 'meta' }, `${meta} · descanso ${fmtFaixa(x.descanso_s, fmtSeg)}`),
    gEx.length > 0 && h('p', { class: 'grupos-ex' }, gEx.map(nomeGrupo).join(' · ')),
    regs.length === 0 && linhaSugestao(x, dia, data)); // TR-03: some depois da 1ª série do dia
  if (!concluido) card.append(h('div', { class: 'serie cab', 'aria-hidden': 'true' },
    h('span', null, '#'), h('span', null, ehTempo ? 'seg' : (x.por_perna ? 'reps/perna' : 'reps')),
    !semKg && h('span', null, ehTempo ? 'kg (opc.)' : 'kg'), h('span')));

  let destacou = false;
  for (let n = 1; n <= nLinhas; n++) {
    const r = regs.find(o => o.serie === n);
    if (r) card.append(linhaFeita(r));
    else if (n <= x.series) { card.append(linhaPendente(x, dia, data, semana, n, !destacou)); destacou = true; }
  }
  return card;
}

// Pré-preenchimento: reps/segundos da mesma série na última sessão;
// carga da série anterior de hoje (se já registrada) ou da última sessão.
function prefill(x, dia, data, n) {
  const campo = x.tipo === 'tempo' ? 'duracao_s' : 'reps';
  const doEx = S.registros.filter(r => r.exercicio === x.id);
  const deHoje = doEx.filter(r => r.data === data && r.dia === dia.id && r.serie < n).sort((a, b) => a.serie - b.serie);
  const antes = doEx.filter(r => r.data < data);
  let ultima = null;
  if (antes.length) {
    const dUlt = antes.reduce((m, r) => (r.data > m ? r.data : m), '');
    const sess = antes.filter(r => r.data === dUlt).sort((a, b) => a.serie - b.serie);
    ultima = sess.find(r => r.serie === n) || sess[sess.length - 1];
  }
  const anteriorHoje = deHoje[deHoje.length - 1];
  const a = ultima?.[campo] ?? anteriorHoje?.[campo];
  const kg = anteriorHoje ? anteriorHoje.carga_kg : ultima?.carga_kg;
  return { a: a == null ? '' : String(a), b: kg == null ? '' : fmtKg(kg) };
}

function linhaPendente(x, dia, data, semana, n, destaque) {
  const chave = `${data}|${dia.id}|${x.id}|${n}`;
  const rasc = UI.rascunhos[chave] || prefill(x, dia, data, n);
  const ehTempo = x.tipo === 'tempo';
  const inA = h('input', { type: 'text', inputmode: 'numeric', pattern: '[0-9]*', enterkeyhint: 'next', autocomplete: 'off',
    placeholder: ehTempo ? fmtFaixa(x.duracao_s) : fmtFaixa(x.reps), value: rasc.a,
    'aria-label': `Série ${n}: ${ehTempo ? 'segundos' : 'repetições'}` });
  const inB = h('input', { type: 'text', inputmode: 'decimal', enterkeyhint: 'done', autocomplete: 'off',
    placeholder: '—', value: rasc.b, 'aria-label': `Série ${n}: carga em kg` });
  const guardar = () => { UI.rascunhos[chave] = { a: inA.value, b: inB.value }; };
  for (const i of [inA, inB]) {
    i.addEventListener('input', guardar);
    i.addEventListener('focus', () => setTimeout(() => { try { i.select(); } catch { /* nada */ } }, 0));
  }
  const semKg = x.com_carga === false;
  inA.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); semKg ? inA.blur() : inB.focus(); } });
  inB.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); inB.blur(); } });
  const ok = h('button', { type: 'button', class: 'btn-ok', 'aria-label': `Concluir série ${n}`,
    onclick: () => concluirSerie(x, dia, data, semana, n, inA.value, semKg ? '' : inB.value, chave) }, svg(ICONE_CHECK));
  return h('div', { class: 'serie' + (destaque ? ' proxima' : '') }, h('span', { class: 'sn' }, n), inA, !semKg && inB, ok);
}

function linhaFeita(r) {
  return h('div', { class: 'serie feita' },
    h('span', { class: 'ok-ico', 'aria-hidden': 'true' }, svg(ICONE_CHECK)),
    h('button', { type: 'button', class: 'resumo', onclick: () => abrirEdicao(r.id), 'aria-label': `Série ${r.serie}: ${textoSerie(r)}. Toque para editar` },
      h('span', { class: 'rs-n' }, `Série ${r.serie}`), h('span', { class: 'rs-v' }, textoSerie(r))));
}

function textoSerie(r) {
  const kg = r.carga_kg != null ? `${fmtKg(r.carga_kg)} kg` : null;
  if (r.duracao_s != null) return kg ? `${kg} · ${r.duracao_s} s` : `${r.duracao_s} s`;
  return kg ? `${kg} × ${r.reps}` : `${r.reps} reps`;
}

function validarValores(ehTempo, txtA, txtB) {
  const a = lerNumero(txtA);
  if (a == null || !Number.isInteger(a) || a < 1 || a > 9999)
    return { erro: ehTempo ? 'Informe os segundos (número inteiro).' : 'Informe as repetições (número inteiro).' };
  const kg = lerNumero(txtB);
  if (Number.isNaN(kg) || (kg != null && kg > 1000)) return { erro: 'Carga inválida. Use só números, ex.: 42,5' };
  return { a, kg };
}

function concluirSerie(x, dia, data, semana, n, txtA, txtB, chave) {
  Som.desbloquear(); // o toque libera o áudio no iPhone
  const ehTempo = x.tipo === 'tempo';
  const v = validarValores(ehTempo, txtA, txtB);
  if (v.erro) return toast(v.erro, 'erro');

  // Mesmo formato de registro_exemplo + id, tipo e registrado_em
  const r = { data, semana, dia: dia.id, exercicio: x.id, serie: n };
  if (ehTempo) { r.duracao_s = v.a; if (v.kg != null) r.carga_kg = v.kg; }
  else { r.reps = v.a; r.carga_kg = v.kg; } // carga null = sem carga (peso do corpo)
  Object.assign(r, { obs: '', id: uid(), tipo: x.tipo, registrado_em: dataHoraLocal() });
  const sAnd = Sessao.emAndamento(); // vínculo só com o treino em andamento do mesmo dia e data
  if (sAnd && sAnd.data === data && sAnd.dia === dia.id) r.sessao_id = sAnd.id;

  const feitasEx = () => new Set(S.registros.filter(o => o.data === data && o.dia === dia.id && o.exercicio === x.id
    && o.serie >= 1 && o.serie <= x.series).map(o => o.serie)).size;
  const antes = feitasEx();
  S.registros = S.registros.filter(o => !(o.data === data && o.dia === dia.id && o.exercicio === x.id && o.serie === n));
  S.registros.push(r);
  if (antes < x.series && feitasEx() >= x.series) UI.rolarProximo = true; // exercício acabou de ficar completo
  salvarRegistros();
  delete UI.rascunhos[chave];
  document.activeElement?.blur?.();
  Timer.iniciar(x.descanso_s, `${x.nome} ${n}/${x.series}`);
  render();
}

function abrirEdicao(id) {
  const r = S.registros.find(o => o.id === id);
  if (!r) return;
  const dlg = $('#dlg');
  const ehTempo = r.duracao_s != null;
  const inA = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', value: String(ehTempo ? r.duracao_s : r.reps) });
  const inB = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'sem carga', value: r.carga_kg != null ? fmtKg(r.carga_kg) : '' });
  const inObs = h('textarea', { rows: '2', placeholder: 'opcional', value: r.obs || '' });
  inObs.style.fontFamily = 'inherit'; inObs.style.minHeight = '80px';
  const fechar = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  const salvar = () => {
    const v = validarValores(ehTempo, inA.value, inB.value);
    if (v.erro) return toast(v.erro, 'erro');
    if (ehTempo) { r.duracao_s = v.a; if (v.kg != null) r.carga_kg = v.kg; else delete r.carga_kg; }
    else { r.reps = v.a; r.carga_kg = v.kg; }
    r.obs = inObs.value.trim();
    r.editado_em = dataHoraLocal();
    salvarRegistros(); fechar(); toast('Série atualizada'); render();
  };
  const excluir = () => {
    if (!confirm('Excluir esta série?')) return;
    S.registros = S.registros.filter(o => o.id !== r.id);
    salvarRegistros(); fechar(); toast('Série excluída'); render();
  };
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => e.preventDefault() },
    h('h2', null, `${nomeExercicio(r.exercicio)} · série ${r.serie}`),
    h('p', { class: 'muted' }, `${fmtData(r.data)} · ${diaPorId(r.dia)?.nome ?? 'Dia ' + r.dia} · semana ${r.semana}`),
    h('label', { class: 'rotulo' }, ehTempo ? 'Segundos' : 'Repetições', inA),
    h('label', { class: 'rotulo' }, 'Carga (kg)', inB),
    h('label', { class: 'rotulo' }, 'Observação', inObs),
    h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'btn-pri', onclick: salvar }, 'Salvar'),
      h('button', { type: 'button', onclick: fechar }, 'Cancelar')),
    h('button', { type: 'button', class: 'btn-perigo btn-bloco', onclick: excluir }, 'Excluir série')));
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}

/* ==========================================================================
   SESSÃO DE TREINO — 1.1.0 (iniciar/finalizar, duração, esforço, dor)
   Formato de registro_exemplo.sessao do treino.json. Em andamento = "fim" null.
   Só uma em andamento por vez. Série registrada sem sessão continua valendo (sem sessao_id).
   ========================================================================== */
const Sessao = {
  int: null,
  emAndamento() { return S.sessoes.find(s => s && s.fim == null) || null; },
  finalizadas() { return S.sessoes.filter(s => s && s.fim != null); },
  porId(id) { return S.sessoes.find(s => s && s.id === id) || null; },
  decorrido(s) { return (Date.now() - Date.parse(s.inicio)) / 1000; },
  iniciar(diaId) {
    if (this.emAndamento()) return toast('Já existe um treino em andamento.', 'erro');
    const data = hoje();
    S.sessoes.push({ id: 's-' + uid(), dia: diaId, semana: semanaEm(data), data, inicio: dataHoraLocal(), fim: null,
      duracao_s: null, esforco: null, dor: { houve: false, obs: '' }, obs: '', sessao_relogio: null });
    salvarSessoes();
    toast('Treino iniciado');
    UI.rolarProximo = true;
    this.rodar(); render();
  },
  finalizar(fimIso, focarFim = false) { // grava fim e duração na hora e abre a folha de fim
    const s = this.emAndamento();
    if (!s) return;
    s.fim = fimIso || dataHoraLocal();
    s.duracao_s = Math.max(0, Math.round((Date.parse(s.fim) - Date.parse(s.inicio)) / 1000));
    salvarSessoes();
    this.parar(); render();
    abrirFolhaSessao(s.id, { fim: true, focarFim });
  },
  apagar(id) { // apaga a sessão e só remove o vínculo das séries
    S.sessoes = S.sessoes.filter(s => !s || s.id !== id);
    let n = 0;
    for (const r of S.registros) if (r.sessao_id === id) { delete r.sessao_id; n++; }
    salvarSessoes();
    if (n) salvarRegistros();
  },
  rodar() { clearInterval(this.int); this.int = setInterval(() => this.tick(), 1000); this.tick(); },
  parar() { clearInterval(this.int); this.int = null; },
  tick() {
    const s = this.emAndamento();
    if (!s) return this.parar();
    const el = $('#cron-sessao b');
    if (el) el.textContent = fmtCron(this.decorrido(s));
  },
  ultimaSerie(id) { // registrado_em da última série vinculada; sugestão de término
    const t = S.registros.filter(r => r.sessao_id === id && typeof r.registrado_em === 'string').map(r => r.registrado_em);
    return t.length ? t.reduce((m, v) => (Date.parse(v) > Date.parse(m) ? v : m)) : null;
  },
  verificarEsquecida() { // ao abrir o app: sessão aberta há mais de 3 h
    const s = this.emAndamento();
    if (!s || UI.perguntouSessao === s.id || $('#dlg').open) return;
    if (!(this.decorrido(s) > HORAS_SESSAO_ESQUECIDA * 3600)) return;
    UI.perguntouSessao = s.id;
    perguntarSessaoEsquecida(s);
  }
};

function desenharBarraSessao() { // 1.5.0: tempo total e Finalizar no painel fixo do topo, em qualquer aba
  const p = $('#cron-sessao'), s = S.plano ? Sessao.emAndamento() : null;
  p.hidden = !s;
  if (s) {
    $('.cs-nome', p).textContent = diaPorId(s.dia)?.nome ?? 'Treino ' + s.dia;
    $('b', p).textContent = fmtCron(Sessao.decorrido(s));
  }
  medirTopo();
}
// reserva no alto da página o espaço do painel fixo, para ele não cobrir o conteúdo
function medirTopo() {
  const t = $('#topo');
  const visivel = [...t.children].some(c => !c.hidden);
  document.documentElement.style.setProperty('--topo-h', visivel ? `${t.offsetHeight + 8}px` : '0px');
}

// US-01 (1.2.1): um toque sem querer em "Finalizar treino" encerrava a sessão na hora; agora pede confirmação
function confirmarFinalizar() {
  const s = Sessao.emAndamento();
  if (!s) return;
  const nome = diaPorId(s.dia)?.nome ?? 'Treino ' + s.dia;
  if (!confirm(`Finalizar o treino agora?\n\n${nome} em andamento há ${fmtDuracao(Sessao.decorrido(s))}.`)) return;
  Sessao.finalizar();
}

function perguntarSessaoEsquecida(s) {
  const dlg = $('#dlg');
  const fechar = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  const nome = diaPorId(s.dia)?.nome ?? 'Treino ' + s.dia;
  dlg.replaceChildren(h('div', null,
    h('h2', null, 'Esta sessão ainda está em andamento?'),
    h('p', { class: 'muted' }, `${nome} começou em ${fmtData(s.inicio).slice(0, 5)} às ${fmtHora(s.inicio)}, há ${fmtDuracao(Sessao.decorrido(s))}.`),
    h('button', { type: 'button', class: 'btn-pri btn-bloco', onclick: () => { fechar(); Sessao.finalizar(dataHoraLocal()); } }, 'Finalizar agora'),
    h('button', { type: 'button', class: 'btn-bloco', onclick: () => { fechar(); Sessao.finalizar(Sessao.ultimaSerie(s.id) || dataHoraLocal(), true); } }, 'Ajustar o horário de término')));
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}

// Folha de fim de sessão; a mesma folha edita a sessão pelo Histórico.
// Só a hora é editável: início fica na data da sessão; término no mesmo dia, ou no seguinte se for antes do início.
function abrirFolhaSessao(id, { fim = false, focarFim = false, focarRelogio = false } = {}) {
  const s = Sessao.porId(id);
  if (!s || s.fim == null) return;
  const dlg = $('#dlg');
  const fechar = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  let esforco = ehInt(s.esforco) ? s.esforco : null, dor = !!s.dor?.houve;

  const botoesEsf = [];
  const marcarEsf = () => botoesEsf.forEach((b, i) => { const on = esforco === i + 1; b.classList.toggle('ativo', on); b.setAttribute('aria-pressed', String(on)); });
  const ANCORAS = { 1: 'muito, muito fácil', 3: 'moderado', 5: 'difícil', 7: 'muito difícil', 10: 'máximo' }; // TR-08 item 4 (Foster)
  for (let n = 1; n <= 10; n++) botoesEsf.push(h('button', { type: 'button', 'aria-label': ANCORAS[n] ? `${n}, ${ANCORAS[n]}` : String(n),
    onclick: () => { esforco = esforco === n ? null : n; marcarEsf(); } }, n));
  marcarEsf();

  const inDorObs = h('input', { type: 'text', autocomplete: 'off', placeholder: 'onde e como (opcional)', value: s.dor?.obs || '' });
  const rotDorObs = h('label', { class: 'rotulo' }, 'Observação da dor', inDorObs);
  const alertaDor = h('div', { class: 'aviso erro alerta-dor', role: 'alert' }, // TR-08 item 3
    'Dor ou aperto no peito, falta de ar fora do normal, tontura ou desmaio: pare e procure atendimento médico.');
  const bNao = h('button', { type: 'button', onclick: () => { dor = false; marcarDor(); } }, 'Não');
  const bSim = h('button', { type: 'button', onclick: () => { dor = true; marcarDor(); } }, 'Sim');
  const marcarDor = () => {
    bNao.classList.toggle('ativo', !dor); bSim.classList.toggle('ativo', dor);
    bNao.setAttribute('aria-pressed', String(!dor)); bSim.setAttribute('aria-pressed', String(dor));
    rotDorObs.style.display = dor ? '' : 'none';
    alertaDor.style.display = dor ? '' : 'none';
  };
  marcarDor();

  const inObs = h('textarea', { rows: '2', placeholder: 'opcional', value: s.obs || '' });
  inObs.style.fontFamily = 'inherit'; inObs.style.minHeight = '80px';
  const inIni = h('input', { type: 'time', value: fmtHora(s.inicio), 'aria-label': 'Horário de início' });
  const inFim = h('input', { type: 'time', value: fmtHora(s.fim), 'aria-label': 'Horário de término' });
  const txtDur = h('p', { class: 'muted' });

  const calcular = () => {
    const hi = inIni.value.slice(0, 5), hf = inFim.value.slice(0, 5);
    if (!/^\d{2}:\d{2}$/.test(hi) || !/^\d{2}:\d{2}$/.test(hf)) return { erro: 'Preencha o início e o término.' };
    const [y, m, d] = partes(s.inicio);
    const em = (hhmm, dias, seg) => { const [a, b] = hhmm.split(':').map(Number); return new Date(y, m - 1, d + dias, a, b, seg); };
    const inicio = hi === fmtHora(s.inicio) ? s.inicio : dataHoraLocal(em(hi, 0, 0));
    let fimIso = s.fim;
    if (hf !== fmtHora(s.fim) || inicio !== s.inicio) {
      const seg = hf === fmtHora(s.fim) ? Number(s.fim.slice(17, 19)) || 0 : 0;
      let f = em(hf, 0, seg);
      if (f.getTime() < Date.parse(inicio)) {
        if (hf === fmtHora(inicio)) return { erro: 'O término precisa ser depois do início.' }; // mesmo minuto ≠ dia seguinte
        f = em(hf, 1, seg);
      }
      fimIso = dataHoraLocal(f);
    }
    const dur = Math.round((Date.parse(fimIso) - Date.parse(inicio)) / 1000);
    if (!(dur > 0)) return { erro: 'O término precisa ser depois do início.' };
    return { inicio, fim: fimIso, duracao_s: dur };
  };
  const mostrarDur = () => { const c = calcular(); txtDur.textContent = c.erro || `Duração: ${fmtDuracao(c.duracao_s)}`; };
  inIni.addEventListener('input', mostrarDur);
  inFim.addEventListener('input', mostrarDur);
  mostrarDur();

  // 1.4.0: dados do relógio (manual ou importados do arquivo do treino)
  let rel = s.sessao_relogio && typeof s.sessao_relogio === 'object' ? Object.assign({}, s.sessao_relogio) : null;
  const campoN = (ph, rotulo, v) => h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: ph, 'aria-label': rotulo, value: v ?? '' });
  const inRFcm = campoN('130', 'FC média', rel?.fc_media), inRFcx = campoN('165', 'FC máxima', rel?.fc_max), inRCal = campoN('450', 'Calorias', rel?.calorias);
  const infoRel = h('div', { class: 'cr-info' });
  if (rel?.inicio || rel?.duracao_s) infoRel.append(h('p', { class: 'muted' }, `Relógio${rel.fonte && rel.fonte !== 'manual' ? ' (' + rel.fonte.toUpperCase() + ')' : ''}: ` +
    [rel.inicio && `início ${fmtHora(rel.inicio)}`, rel.duracao_s && fmtDuracao(rel.duracao_s)].filter(Boolean).join(' · ')));
  const btnRel = botaoRelogio('Importar arquivo do relógio', res => {
    rel = { fonte: res.fonte, inicio: res.inicio, duracao_s: res.decorrido_s ?? res.duracao_s, distancia_km: res.distancia_km };
    if (res.detalhe && Array.isArray(res.detalhe.fc)) { const dt = res.detalhe; rel.detalhe = { v: 1, passo: dt.passo, fc: dt.fc, zonas: dt.zonas ?? null, te: dt.te ?? null, tea: dt.tea ?? null, carga: dt.carga ?? null }; }
    if (res.fc_media != null) inRFcm.value = res.fc_media;
    if (res.fc_max != null) inRFcx.value = res.fc_max;
    if (res.calorias != null) inRCal.value = res.calorias;
    const itens = [res.inicio && `início ${fmtHora(res.inicio)}`, rel.duracao_s && fmtDuracao(rel.duracao_s), res.fc_media != null && `FC ${res.fc_media}`,
      res.calorias != null && `${res.calorias} kcal`].filter(Boolean);
    infoRel.replaceChildren(h('p', null, h('b', null, `Lido do relógio (${res.fonte.toUpperCase()}): `), itens.join(' · ')));
    if (res.esporte === 'corrida' || res.esporte === 'caminhada') infoRel.append(h('p', { class: 'muted' }, `O arquivo parece ser de ${NOME_ESPORTE[res.esporte]}. Para corrida, use o cartão da corrida.`));
    if (res.data && res.data !== s.data) infoRel.append(h('p', { class: 'muted' }, `Atenção: o arquivo é de ${fmtData(res.data)} e esta sessão é de ${fmtData(s.data)}.`));
    else if (res.inicio && rel.duracao_s) infoRel.append(h('button', { type: 'button', class: 'link', onclick: () => {
      inIni.value = fmtHora(res.inicio);
      inFim.value = fmtHora(dataHoraLocal(new Date(Date.parse(res.inicio) + rel.duracao_s * 1000)));
      mostrarDur();
    } }, 'Usar o início e o término do relógio'));
  });
  const secRel = h('div', { class: 'sec-rel' },
    h('div', { class: 'rot-grupo' }, 'Relógio (opcional)'),
    btnRel, infoRel,
    h('div', { class: 'cr-grade tres' },
      h('label', { class: 'rotulo' }, 'FC média', inRFcm), h('label', { class: 'rotulo' }, 'FC máx.', inRFcx), h('label', { class: 'rotulo' }, 'kcal', inRCal)));
  const lerRelogio = () => {
    const fm = lerNumero(inRFcm.value), fx = lerNumero(inRFcx.value), cal = lerNumero(inRCal.value);
    for (const [v, n] of [[fm, 'FC média'], [fx, 'FC máxima']]) if (Number.isNaN(v) || (v != null && !(ehInt(v) && v >= 30 && v <= 240))) return { erro: `${n} do relógio inválida (de 30 a 240).` };
    if (Number.isNaN(cal) || (cal != null && !(ehInt(cal) && cal > 0 && cal < 10000))) return { erro: 'Calorias inválidas.' };
    if (fm != null && fx != null && fm > fx) return { erro: 'A FC média não pode passar da máxima.' };
    const tem = fm != null || fx != null || cal != null || rel?.duracao_s != null;
    return { valor: tem ? Object.assign({ fonte: 'manual', inicio: null, duracao_s: null, distancia_km: null }, rel || {}, { fc_media: fm, fc_max: fx, calorias: cal }) : null };
  };

  const salvar = () => {
    const c = calcular();
    if (c.erro) return toast(c.erro, 'erro');
    const rl = lerRelogio();
    if (rl.erro) return toast(rl.erro, 'erro');
    s.sessao_relogio = rl.valor;
    Object.assign(s, { inicio: c.inicio, fim: c.fim, duracao_s: c.duracao_s, esforco,
      dor: { houve: dor, obs: dor ? inDorObs.value.trim() : '' }, obs: inObs.value.trim() });
    salvarSessoes(); fechar(); toast('Sessão salva'); render();
  };
  const apagar = () => {
    if (!confirm('Apagar esta sessão?\n\nAs séries continuam no histórico; só perdem o vínculo com ela.')) return;
    Sessao.apagar(s.id); fechar(); toast('Sessão apagada'); render();
  };
  dlg.replaceChildren(h('form', { method: 'dialog', onsubmit: e => e.preventDefault() },
    h('h2', null, fim ? 'Treino finalizado' : 'Editar sessão'),
    h('p', { class: 'muted' }, `${diaPorId(s.dia)?.nome ?? 'Treino ' + s.dia} · ${fmtData(s.data)} · semana ${s.semana}`),
    h('div', { class: 'rot-grupo' }, 'Como foi o treino inteiro? Esforço de 1 a 10 (opcional)'),
    h('div', { class: 'esforco', role: 'group', 'aria-label': 'Como foi o treino inteiro? Esforço de 1 a 10' }, botoesEsf),
    h('p', { class: 'muted ancoras' }, '1 muito, muito fácil · 3 moderado · 5 difícil · 7 muito difícil · 10 máximo'),
    h('div', { class: 'rot-grupo' }, 'Teve dor?'),
    h('div', { class: 'seg-sn', role: 'group', 'aria-label': 'Teve dor?' }, bNao, bSim),
    alertaDor,
    rotDorObs,
    h('label', { class: 'rotulo' }, 'Observação', inObs),
    h('div', { class: 'horarios' }, h('label', { class: 'rotulo' }, 'Início', inIni), h('label', { class: 'rotulo' }, 'Término', inFim)),
    txtDur,
    secRel,
    h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'btn-pri', onclick: salvar }, 'Salvar'),
      h('button', { type: 'button', onclick: fechar }, fim ? 'Pular' : 'Cancelar')),
    !fim && h('button', { type: 'button', class: 'btn-perigo btn-bloco', onclick: apagar }, 'Apagar sessão')));
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  if (focarFim) setTimeout(() => { inFim.focus(); inFim.scrollIntoView?.({ block: 'center' }); }, 50);
  if (focarRelogio) setTimeout(() => secRel.scrollIntoView?.({ block: 'start' }), 50);
}

/* ==========================================================================
   PROGRESSÃO — 1.2.0 (TR-03 a TR-09: dupla progressão, esforço, dor e pausa)
   Só sugere: nada é gravado, a carga e a semana nunca mudam sozinhas.
   Última sessão do exercício = registros com data anterior à da tela, na data mais recente (como em prefill()).
   ========================================================================== */
const INCREMENTO_PADRAO_KG = 2.5;
const DIAS_PAUSA_LONGA = 28;
const incrementoDe = x => (ehNum(x.incremento_kg) && x.incremento_kg > 0 ? x.incremento_kg : INCREMENTO_PADRAO_KG); // TR-04
const arred2 = n => Math.round(n * 100) / 100;
const ddmm = iso => fmtData(iso).slice(0, 5);

function dorNasDuasUltimas() { // TR-08: as duas últimas sessões finalizadas (de qualquer dia) com dor → a mais recente
  const f = Sessao.finalizadas().slice().sort((a, b) => Date.parse(b.inicio) - Date.parse(a.inicio));
  return f.length >= 2 && f[0].dor?.houve && f[1].dor?.houve ? f[0] : null;
}

// → null (sem sugestão) ou { tipo: aumentar|manter|reduzir|retorno|dominada|nenhuma, texto, carga? }
function estadoProgressao(x, dataTela) {
  const doEx = S.registros.filter(r => r.exercicio === x.id && typeof r.data === 'string' && r.data < dataTela);
  if (!doEx.length) return null;
  const datas = [...new Set(doEx.map(r => r.data))].sort();
  const seriesDe = d => { // séries 1..x.series da data d (acima de x.series são ignoradas)
    const m = new Map();
    for (const r of doEx) if (r.data === d && ehInt(r.serie) && r.serie >= 1 && r.serie <= x.series) m.set(r.serie, r);
    return [...m.values()];
  };
  const dUlt = datas[datas.length - 1], ult = seriesDe(dUlt);
  if (ult.length < x.series) return null; // TR-03 regra 1: sessão incompleta

  const ehTempo = x.tipo === 'tempo';
  const campo = ehTempo ? 'duracao_s' : 'reps', faixa = ehTempo ? x.duracao_s : x.reps;
  const [piso, topo] = faixa, un = ehTempo ? ' s' : ' reps';
  const todasNoTopo = ult.every(r => ehNum(r[campo]) && r[campo] >= topo);
  const abaixoPiso = ss => ss.some(r => ehNum(r[campo]) && r[campo] < piso);

  // Sessões vinculadas (sessao_id); registro sem vínculo = esforço e dor desconhecidos
  const sess = [...new Set(ult.map(r => r.sessao_id).filter(Boolean))].map(id => Sessao.porId(id)).filter(s => s && s.fim != null);
  const esforcos = sess.map(s => s.esforco).filter(ehInt);
  const esforco = esforcos.length ? Math.max(...esforcos) : null;
  const dor = sess.find(s => s.dor?.houve) || dorNasDuasUltimas(); // TR-08 itens 1 e 2
  const pausa = diasEntre(dUlt, dataTela), semanasPausa = Math.floor(pausa / 7);
  const pausaLonga = pausa > DIAS_PAUSA_LONGA; // TR-09

  // TR-06: sem carga (com_carga false, ou campo ausente e nenhuma carga registrada) → progride por repetições/tempo
  const comCarga = typeof x.com_carga === 'boolean' ? x.com_carga : null; // fora do formato = ausente
  if (comCarga === false || (comCarga == null && ult.every(r => r.carga_kg == null))) {
    if (pausaLonga) return { tipo: 'manter', texto: `Voltando após ${semanasPausa} semanas: não aumente hoje.` };
    if (dor) return { tipo: 'manter', texto: `Dor em ${ddmm(dor.data)}: mantenha.` };
    if (!todasNoTopo) return { tipo: 'manter', texto: `Busque pelo menos ${metaProxima(ult, campo, piso, topo, ehTempo)}${un} em cada série.` };
    if (esforco > 8) return { tipo: 'manter', texto: `Esforço ${esforco} da última vez: mantenha.` };
    return { tipo: 'dominada', texto: 'Faixa dominada: dá para passar a uma variação mais difícil.' };
  }

  // TR-03 regra 3: carga faltando ou diferente entre séries → sem sugestão, com o motivo
  const cargas = ult.map(r => r.carga_kg);
  if (cargas.some(c => !ehNum(c))) return { tipo: 'nenhuma', texto: 'Registre a carga para receber sugestão.' };
  if (new Set(cargas).size > 1) return progressaoMista(ult, { campo, piso, topo, ehTempo, esforco, dor, pausaLonga, semanasPausa });
  const C = cargas[0], inc = incrementoDe(x);

  if (pausaLonga) { // TR-09: ~90% da última carga, para baixo em passos de 0,5 kg
    const c90 = Math.floor(C * 0.9 * 2) / 2;
    return { tipo: 'retorno', carga: c90, texto: `Voltando após ${semanasPausa} semanas: comece com ${fmtKg(c90)} kg.` };
  }
  if (piso < topo && arred2(C - inc) > 0 && datas.length >= 2) { // TR-05: duas sessões abaixo do piso, mesma carga
    const ant = seriesDe(datas[datas.length - 2]);
    if (ant.length && ant.every(r => r.carga_kg === C) && abaixoPiso(ult) && abaixoPiso(ant))
      return { tipo: 'reduzir', carga: arred2(C - inc), texto: `Duas vezes abaixo de ${piso}${ehTempo ? ' s' : ' reps'}: desça para ${fmtKg(arred2(C - inc))} kg.` };
  }
  if (dor) return { tipo: 'manter', texto: `Dor em ${ddmm(dor.data)}: mantenha ${fmtKg(C)} kg.` };
  if (!todasNoTopo) return { tipo: 'manter', texto: `Mantenha ${fmtKg(C)} kg e busque pelo menos ${metaProxima(ult, campo, piso, topo, ehTempo)}${un} em cada.` };
  if (esforco > 8) return { tipo: 'manter', texto: `Mantenha ${fmtKg(C)} kg: esforço ${esforco} da última vez.` };
  const novo = arred2(C + inc), pct = C > 0 ? Math.round((inc / C) * 100) : 0; // TR-04 (0 kg: sem percentual)
  // salto acima de 10%: alternativa de ficar na carga e fazer mais repetições/tempo
  const extra = ehTempo ? `${topo + 5}–${topo + 10} s` : `${topo + 1}–${topo + 2} reps`;
  return { tipo: 'aumentar', carga: novo, texto: `Suba para ${fmtKg(novo)} kg.`,
    nota: pct > 10 ? `Salto de ${pct}%. Se pesar, fique em ${fmtKg(C)} kg e faça ${extra}.` : null };
}

// 1.4.1: cargas diferentes entre as séries da última vez (rampa, queda de carga, ajuste no meio).
// Carga de trabalho = mediana das cargas (com número par de séries, a menor das duas do meio).
// Meta: com essa carga em todas as séries, buscar o topo da faixa; se ficou abaixo do piso com ela, buscar o piso.
// Todas as séries no topo → usar a maior carga em todas. A regra de reduzir (duas vezes abaixo do piso) só vale para carga igual.
// 1.4.1: meta da próxima vez = pior série + 1 rep (+5 s no tempo), sem passar do topo e sem ficar abaixo do piso
function metaProxima(series, campo, piso, topo, ehTempo) {
  const v = series.map(r => r[campo]).filter(ehNum);
  const base = v.length ? Math.min(...v) : piso - (ehTempo ? 5 : 1);
  return Math.min(topo, Math.max(piso, base + (ehTempo ? 5 : 1)));
}
function progressaoMista(ult, { campo, piso, topo, ehTempo, esforco, dor, pausaLonga, semanasPausa }) {
  const un = ehTempo ? ' s' : ' reps';
  const ord = ult.map(r => r.carga_kg).sort((a, b) => a - b);
  const M = ord[Math.floor((ord.length - 1) / 2)], maior = ord[ord.length - 1];
  const nota = 'Última vez: ' + ult.slice().sort((a, b) => a.serie - b.serie)
    .map(r => `${fmtKg(r.carga_kg)} kg × ${ehNum(r[campo]) ? r[campo] : '?'}${ehTempo ? ' s' : ''}`).join(' · ');
  if (pausaLonga) {
    const c90 = Math.floor(M * 0.9 * 2) / 2;
    return { tipo: 'retorno', carga: c90, texto: `Voltando após ${semanasPausa} semanas: comece com ${fmtKg(c90)} kg em todas.`, nota };
  }
  if (dor) return { tipo: 'manter', carga: M, texto: `Dor em ${ddmm(dor.data)}: fique em ${fmtKg(M)} kg em todas, sem subir.`, nota };
  const todasNoTopo = ult.every(r => ehNum(r[campo]) && r[campo] >= topo);
  if (todasNoTopo && !(esforco > 8) && maior > M)
    return { tipo: 'aumentar', carga: maior, texto: `Todas no topo: use ${fmtKg(maior)} kg em todas.`, nota };
  if (esforco > 8) return { tipo: 'manter', carga: M, texto: `Esforço ${esforco} da última vez: use ${fmtKg(M)} kg em todas.`, nota };
  const alvo = metaProxima(ult.filter(r => r.carga_kg === M), campo, piso, topo, ehTempo);
  return { tipo: 'manter', carga: M, texto: `Use ${fmtKg(M)} kg em todas e busque pelo menos ${alvo}${un} em cada.`, nota };
}

// TR-07: "Usar C kg" só preenche o campo de kg das séries pendentes (rascunho); nada é registrado
function usarCarga(x, dia, data, carga) {
  for (let n = 1; n <= x.series; n++) {
    if (S.registros.some(r => r.data === data && r.dia === dia.id && r.exercicio === x.id && r.serie === n)) continue;
    const chave = `${data}|${dia.id}|${x.id}|${n}`;
    const rasc = UI.rascunhos[chave] || prefill(x, dia, data, n);
    UI.rascunhos[chave] = { a: rasc.a, b: fmtKg(carga) };
  }
  render();
}

function linhaSugestao(x, dia, data) {
  const e = estadoProgressao(x, data);
  if (!e) return null;
  return h('div', { class: 'sugestao ' + e.tipo, role: 'note' },
    h('span', null, e.texto, e.nota && h('small', null, e.nota)),
    e.carga != null && h('button', { type: 'button', class: 'chip', onclick: () => usarCarga(x, dia, data, e.carga) }, `Usar ${fmtKg(e.carga)} kg`));
}

/* ==========================================================================
   TIMER DE DESCANSO (som, vibração, tela acesa)
   Usa o relógio do sistema (Date.now), não contagem de ticks: se o celular
   pausar o app, ao voltar o tempo mostrado continua certo.
   ========================================================================== */
const Som = {
  ctx: null,
  desbloquear() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
    } catch { /* sem áudio */ }
  },
  bipe(seq) { // seq: [[frequência Hz (0 = pausa), duração s], ...]
    const c = this.ctx;
    if (!c) return;
    try {
      if (c.state !== 'running') c.resume();
      let t = c.currentTime + 0.03;
      for (const [f, d] of seq) {
        if (f > 0) {
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'square'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          o.connect(g); g.connect(c.destination);
          o.start(t); o.stop(t + d + 0.02);
        }
        t += d;
      }
    } catch { /* nada */ }
  }
};

const Tela = { // Wake Lock: mantém a tela acesa enquanto o timer roda
  quer: false, lock: null, pedindo: false,
  async manter(sim) {
    this.quer = sim;
    if (!sim) { const l = this.lock; this.lock = null; try { await l?.release(); } catch { /* nada */ } return; }
    if (!('wakeLock' in navigator) || this.lock || this.pedindo || document.visibilityState !== 'visible') return;
    this.pedindo = true;
    try {
      const l = await navigator.wakeLock.request('screen');
      if (!this.quer) l.release();
      else { this.lock = l; l.addEventListener('release', () => { if (this.lock === l) this.lock = null; }); }
    } catch { /* recusado: segue sem */ }
    this.pedindo = false;
  }
};

function alertar(tipo) { // 'min' = pode ir; 'max' = passou do máximo
  if (S.config.vibracao && typeof navigator.vibrate === 'function') {
    try { navigator.vibrate(tipo === 'min' ? [300, 150, 300] : [700]); } catch { /* nada */ }
  }
  if (S.config.som) Som.bipe(tipo === 'min' ? [[880, 0.18], [0, 0.1], [880, 0.18], [0, 0.1], [1320, 0.3]] : [[520, 0.7]]);
  const t = $('#timer');
  t.classList.remove('pisca'); void t.offsetWidth; t.classList.add('pisca');
}

const Timer = {
  st: Armaz.ler(CHAVES.timer, null), // { inicio, min, max, rotulo, avisouMin, avisouMax }
  int: null,
  iniciar(faixa, rotulo) {
    this.st = { inicio: Date.now(), min: faixa[0], max: faixa[1], rotulo, avisouMin: false, avisouMax: false };
    this.salvar(); Tela.manter(true); this.rodar();
  },
  parar() {
    this.st = null; this.salvar(); Tela.manter(false);
    clearInterval(this.int); this.int = null; this.desenhar();
  },
  salvar() { Armaz.gravar(CHAVES.timer, this.st); },
  rodar() { clearInterval(this.int); this.int = setInterval(() => this.tick(), 250); this.tick(); },
  decorrido() { return this.st ? (Date.now() - this.st.inicio) / 1000 : 0; },
  tick() {
    const st = this.st;
    if (!st) return this.desenhar();
    const el = this.decorrido();
    if (el >= st.max && !st.avisouMax) {
      st.avisouMin = st.avisouMax = true; this.salvar();
      alertar(st.max > st.min ? 'max' : 'min');
    } else if (el >= st.min && !st.avisouMin) {
      st.avisouMin = true; this.salvar();
      alertar('min');
    }
    if (el > st.max + 180) return this.parar(); // esquecido ligado: desliga sozinho
    this.desenhar();
  },
  desenhar() {
    const t = $('#timer'), st = this.st;
    if (!st) {
      t.hidden = true;
      medirTopo();
      return;
    }
    const el = this.decorrido();
    const fase = el < st.min ? 'descansando' : (el >= st.max && st.max > st.min ? 'passou' : 'pronto');
    t.hidden = false;
    t.classList.toggle('pronto', fase === 'pronto');
    t.classList.toggle('passou', fase === 'passou');
    $('.t-rot', t).textContent = st.rotulo;
    $('.t-meta', t).textContent =
      fase === 'descansando' ? `descanso · meta ${fmtFaixa([st.min, st.max], fmtSeg)}` :
      fase === 'pronto' ? (st.max > st.min ? `pode ir ✓ · máx ${fmtSeg(st.max)}` : 'pode ir ✓') :
      `passou do máximo (${fmtSeg(st.max)})`;
    $('.t-tempo', t).textContent = fmtSeg(el);
    const total = Math.max(st.max, 1), C = 276.46; // circunferência do anel (r = 44)
    $('.t-prog', t).setAttribute('stroke-dashoffset', (C * (1 - Math.min(1, el / total))).toFixed(2));
    medirTopo();
  }
};

/* ==========================================================================
   CORRIDA — fase 1 mostra só a prática da semana (cronômetro e registro: fase 2)
   ========================================================================== */
const blocoCorrida = x => S.plano?.[x.ref ?? 'corrida'] || null;
const fmtNum = n => String(n).replace('.', ',');
/* ==========================================================================
   RELÓGIO — 1.4.0: lê o arquivo de um treino (.fit, .tcx ou .gpx; também .gz)
   exportado do Zepp, do Strava ou de outro app. Tudo roda no aparelho.
   Resultado: { fonte, esporte, data, inicio, duracao_s, decorrido_s, distancia_km,
                fc_media, fc_max, calorias, subida_m, cadencia_spm } (campo ausente = null)
   ========================================================================== */
const FIT_EPOCA = 631065600; // 1989-12-31T00:00:00Z em segundos Unix
const NOME_ESPORTE = { corrida: 'corrida', caminhada: 'caminhada', bike: 'pedal', forca: 'treino de força', outro: 'outro esporte' };

async function lerArquivoRelogio(arquivo) {
  let buf = await arquivo.arrayBuffer();
  let b = new Uint8Array(buf);
  if (b[0] === 0x1f && b[1] === 0x8b) { // .gz (Strava manda assim)
    if (typeof DecompressionStream !== 'function') throw new Error('Este navegador não abre arquivos .gz. Descompacte antes.');
    buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    b = new Uint8Array(buf);
  }
  let res;
  if (b.length > 12 && String.fromCharCode(b[8], b[9], b[10], b[11]) === '.FIT') res = lerFIT(buf);
  else {
    const txt = new TextDecoder('utf-8').decode(b).replace(/^﻿/, '');
    if (/<TrainingCenterDatabase[\s>]/.test(txt)) res = lerTCX(txt);
    else if (/<gpx[\s>]/.test(txt)) res = lerGPX(txt);
    else throw new Error('Formato não reconhecido. Use o arquivo .fit, .tcx ou .gpx do treino.');
  }
  return completarRelogio(res);
}

/* ==========================================================================
   DETALHE DO TREINO — 1.6.0: a série completa do relógio (FC, ritmo, cadência, altitude,
   GPS) reduzida a um ponto a cada 5 s e guardada junto com a corrida, para o relatório.
   pontos brutos: [{ t (s desde o início), fc, cad, v (m/s), alt (m), lat, lon }]
   ========================================================================== */
const PASSO_DETALHE = 5;
const mediaDe = v => (v.length ? v.reduce((a, b) => a + b, 0) / v.length : null);

function subidaDePontos(pontos) { // soma das subidas da altitude suavizada (média de 5 leituras)
  const alt = pontos.map(p => p.alt).filter(ehNum);
  if (alt.length < 5) return null;
  const sua = alt.map((_, i) => mediaDe(alt.slice(Math.max(0, i - 2), i + 3)));
  let s = 0;
  for (let i = 1; i < sua.length; i++) if (sua[i] > sua[i - 1]) s += sua[i] - sua[i - 1];
  return s;
}

function montarDetalhe(r) {
  const pts = (r.pontos || []).filter(p => ehNum(p.t) && p.t >= 0);
  if (pts.length < 20) return null;
  const mult = r.esporte === 'corrida' ? 2 : 1; // cadência do relógio vem em passos de um pé
  const n = Math.floor(pts[pts.length - 1].t / PASSO_DETALHE) + 1;
  const bal = Array.from({ length: n }, () => ({ fc: [], cad: [], v: [], alt: [], lat: null, lon: null }));
  for (const p of pts) {
    const b = bal[Math.min(n - 1, Math.floor(p.t / PASSO_DETALHE))];
    if (ehNum(p.fc) && p.fc > 0) b.fc.push(p.fc);
    if (ehNum(p.cad) && p.cad > 0) b.cad.push(p.cad * mult);
    if (ehNum(p.v) && p.v >= 0) b.v.push(p.v);
    if (ehNum(p.alt)) b.alt.push(p.alt);
    if (ehNum(p.lat) && ehNum(p.lon)) { b.lat = p.lat; b.lon = p.lon; }
  }
  const col = (f) => bal.map(f);
  const arred = (v, esc) => (v == null ? null : Math.round(v * esc));
  const det = {
    v: 1, passo: PASSO_DETALHE, fonte: r.fonte,
    fc: col(b => arred(mediaDe(b.fc), 1)),
    vel: col(b => arred(mediaDe(b.v), 100)),         // cm/s
    alt: col(b => arred(mediaDe(b.alt), 10)),        // dm
    cad: col(b => arred(mediaDe(b.cad), 1)),         // passos/min
    lat: col(b => arred(b.lat, 1e5)), lon: col(b => arred(b.lon, 1e5))
  };
  if (r.voltas_fit?.length) det.parciais = r.voltas_fit;
  for (const [k, v] of [['zonas', r.zonas], ['te', r.te], ['tea', r.tea], ['carga', r.carga], ['desc', r.descida_m],
    ['passo_mm', r.passo_mm], ['fc_min', r.fc_min], ['cad_max', r.cad_max]]) if (v != null) det[k] = v;
  return det;
}

function completarRelogio(r) {
  const n = (v, casas = 0) => (ehNum(v) && v > 0 ? Math.round(v * 10 ** casas) / 10 ** casas : null);
  const out = {
    fonte: r.fonte, esporte: r.esporte || null,
    inicio: null, data: null,
    duracao_s: n(r.duracao_s), decorrido_s: n(r.decorrido_s ?? r.duracao_s),
    distancia_km: n(r.distancia_m != null ? r.distancia_m / 1000 : null, 2),
    fc_media: n(r.fc_media), fc_max: n(r.fc_max), calorias: n(r.calorias),
    subida_m: n(r.subida_m), cadencia_spm: n(r.cadencia_spm), detalhe: null
  };
  if (ehNum(r.inicio_ms)) { const d = new Date(r.inicio_ms); out.inicio = dataHoraLocal(d); out.data = dataISO(d); }
  if (out.distancia_km != null && out.distancia_km < 0.05) out.distancia_km = null;
  out.detalhe = montarDetalhe(r);
  if (out.fc_media != null && out.fc_max != null && out.fc_media > out.fc_max) out.fc_media = null;
  if (out.duracao_s == null && out.distancia_km == null && out.fc_media == null)
    throw new Error('O arquivo não tem dados de treino (tempo, distância ou batimentos).');
  return out;
}

// FIT: protocolo binário da Garmin, usado por Zepp, Garmin, Coros, Strava…

function xmlDe(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('O arquivo está danificado (XML inválido).');
  return doc;
}
const tags = (el, nome) => [...el.getElementsByTagNameNS('*', nome)];
const filho = (el, nome) => el && [...el.children].find(c => c.localName === nome);

function lerTCX(txt) {
  const doc = xmlDe(txt);
  const atv = tags(doc, 'Activity')[0];
  if (!atv) throw new Error('O arquivo .tcx não tem nenhuma atividade.');
  const voltas = tags(atv, 'Lap');
  const pts = tags(atv, 'Trackpoint');
  const fcPts = pts.map(t => numDe(filho(filho(t, 'HeartRateBpm'), 'Value'))).filter(v => ehNum(v) && v > 0);
  const tempos = pts.map(t => Date.parse(filho(t, 'Time')?.textContent || '')).filter(ehNum);
  const soma = f => { const v = voltas.map(f).filter(ehNum); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
  const dur = soma(l => numDe(filho(l, 'TotalTimeSeconds')));
  let fcMedia = null;
  const comFc = voltas.filter(l => ehNum(numDe(filho(filho(l, 'AverageHeartRateBpm'), 'Value'))));
  if (comFc.length) {
    const peso = l => numDe(filho(l, 'TotalTimeSeconds')) || 1;
    fcMedia = comFc.reduce((a, l) => a + numDe(filho(filho(l, 'AverageHeartRateBpm'), 'Value')) * peso(l), 0) / comFc.reduce((a, l) => a + peso(l), 0);
  } else if (fcPts.length) fcMedia = fcPts.reduce((a, b) => a + b, 0) / fcPts.length;
  const maxVoltas = voltas.map(l => numDe(filho(filho(l, 'MaximumHeartRateBpm'), 'Value'))).filter(ehNum);
  const inicio = Date.parse(voltas[0]?.getAttribute('StartTime') || filho(atv, 'Id')?.textContent || '') || tempos[0] || null;
  const distPts = pts.map(t => numDe(filho(t, 'DistanceMeters'))).filter(ehNum);
  const sport = (atv.getAttribute('Sport') || '').toLowerCase();
  const pontos = pts.map(tp => {
    const t = Date.parse(filho(tp, 'Time')?.textContent || '');
    if (!ehNum(t) || !ehNum(tempos[0])) return null;
    const pos = filho(tp, 'Position');
    return { t: (t - tempos[0]) / 1000, fc: numDe(filho(filho(tp, 'HeartRateBpm'), 'Value')), cad: numDe(filho(tp, 'Cadence')), v: numDe(tags(tp, 'Speed')[0]),
      alt: numDe(filho(tp, 'AltitudeMeters')), lat: numDe(filho(pos, 'LatitudeDegrees')), lon: numDe(filho(pos, 'LongitudeDegrees')) };
  }).filter(Boolean);
  const cadMed = mediaDe(pontos.map(o => o.cad).filter(v => ehNum(v) && v > 0));
  return {
    pontos, fonte: 'tcx', esporte: sport === 'running' ? 'corrida' : sport === 'biking' ? 'bike' : sport ? 'outro' : null,
    inicio_ms: inicio, duracao_s: dur,
    decorrido_s: tempos.length > 1 && inicio ? (tempos[tempos.length - 1] - inicio) / 1000 : dur,
    distancia_m: soma(l => numDe(filho(l, 'DistanceMeters'))) || (distPts.length ? distPts[distPts.length - 1] : null),
    fc_media: fcMedia,
    fc_max: maxVoltas.length ? Math.max(...maxVoltas) : (fcPts.length ? Math.max(...fcPts) : null),
    calorias: soma(l => numDe(filho(l, 'Calories'))), subida_m: subidaDePontos(pontos),
    cadencia_spm: sport === 'running' && cadMed ? cadMed * 2 : null

}

function lerGPX(txt) {
  const doc = xmlDe(txt);
  const pts = tags(doc, 'trkpt');
  if (!pts.length) throw new Error('O arquivo .gpx não tem pontos do percurso.');

  for (const pt of pts) {
    const lat = Number(pt.getAttribute('lat')), lon = Number(pt.getAttribute('lon'));
    if (ant && ehNum(lat) && ehNum(lon)) {
      const dLat = rad(lat - ant[0]), dLon = rad(lon - ant[1]);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(ant[0])) * Math.cos(rad(lat)) * Math.sin(dLon / 2) ** 2;
      dist += 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }
    if (ehNum(lat) && ehNum(lon)) ant = [lat, lon];
    const ele = numDe(filho(pt, 'ele'));
    if (ehNum(ele)) { if (eleAnt != null && ele > eleAnt) subida += ele - eleAnt; eleAnt = ele; }
    const t = Date.parse(filho(pt, 'time')?.textContent || '');
    if (ehNum(t)) tempos.push(t);
    const elFc = tags(pt, 'hr')[0] || tags(pt, 'heartrate')[0];
    const v = numDe(elFc);
    if (ehNum(v) && v > 0) fc.push(v);
    brutos.push({ tms: t, fc: v, cad: numDe(tags(pt, 'cad')[0]), v: numDe(tags(pt, 'speed')[0]), alt: ehNum(ele) ? ele : null, lat, lon });
  }
  const pontos = ehNum(tempos[0]) ? brutos.filter(o => ehNum(o.tms)).map(o => ({ ...o, t: (o.tms - tempos[0]) / 1000 })) : [];
  const cadMed = mediaDe(pontos.map(o => o.cad).filter(v => ehNum(v) && v > 0));
  const trk0 = tags(doc, 'trk')[0];
  const tipo = ((trk0 && (filho(trk0, 'type')?.textContent || filho(trk0, 'name')?.textContent)) || '').toLowerCase();
  const dec = tempos.length > 1 ? (tempos[tempos.length - 1] - tempos[0]) / 1000 : null;
  const esporteGpx = /run|corr/.test(tipo) ? 'corrida' : null;
  return {
    pontos, fonte: 'gpx', esporte: /run|corr/.test(tipo) ? 'corrida' : /walk|camin/.test(tipo) ? 'caminhada' : /bik|cycl/.test(tipo) ? 'bike' : null,
    inicio_ms: tempos[0] ?? null, duracao_s: dec, decorrido_s: dec,
    distancia_m: dist > 0 ? dist : null,
    fc_media: fc.length ? fc.reduce((a, b) => a + b, 0) / fc.length : null,
    fc_max: fc.length ? Math.max(...fc) : null,
    calorias: null, subida_m: subida >= 1 ? subida : null, cadencia_spm: esporteGpx && cadMed ? cadMed * 2 : null
  };
}

// Botão + seletor de arquivo. Sem "accept": no Android, filtrar por extensão esconde arquivos .fit.
function botaoRelogio(rotulo, aoLer) {
  const inFile = h('input', { type: 'file', hidden: true });
  const btn = h('button', { type: 'button', class: 'btn-relogio', onclick: () => inFile.click() },
    svg('M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', { traco: 2 }), rotulo);
  inFile.addEventListener('change', async () => {
    const f = inFile.files?.[0];
    inFile.value = '';

    btn.disabled = true;

/* ==========================================================================
   CORRIDA — 1.4.0: registro livre (distância, tempo, pace, FC). O cronograma do

   Registro: { tipo:'corrida', exercicio:'corrida', serie:1, distancia_km, tempo_s, tempo_min,

const corridaDoDia = (data, diaId) => S.registros.find(r => r.tipo === 'corrida' && r.data === data && r.dia === diaId) || null;

function salvarCorrida(v, data, dia, antigo) {

function formCorrida(data, dia, antigo) {
  const extras = {};
  if (antigo) for (const k of EXTRAS_CORRIDA) if (antigo[k] != null) extras[k] = antigo[k];
  const campo = (props, valor) => h('input', Object.assign({ type: 'text', autocomplete: 'off', value: valor ?? '' }, props));

  const inFcm = campo({ inputmode: 'numeric', placeholder: '150', 'aria-label': 'Frequência cardíaca média' }, antigo?.fc_media);

      t > 0 && h('span', { class: 'muted' }, `tempo ${fmtTempo(t)}`)].filter(Boolean));
  };

  inTempo.addEventListener('input', atualizar);
  atualizar();

  const aplicar = res => {
    if (res.distancia_km != null) inKm.value = fmtKmCampo(res.distancia_km);

    for (const k of EXTRAS_CORRIDA) delete extras[k];

}

function linhaExtrasCorrida(r) {
  return [r.fc_media != null && `FC média ${r.fc_media}`, r.fc_max != null && `máx ${r.fc_max}`, r.calorias != null && `${r.calorias} kcal`,
    r.subida_m != null && `subida ${r.subida_m} m`, r.cadencia_spm != null && `${r.cadencia_spm} passos/min`].filter(Boolean).join(' · ');
}
function textoCorrida(r) {
  const t = tempoDe(r), p = paceDe(r);
  return [r.distancia_km != null && `${fmtKm(r.distancia_km)} km`, t != null && fmtTempo(t), p && `${fmtPace(p)} /km`].filter(Boolean).join(' · ') || 'corrida';
}
function marcosCorrida(r) { // comparação com as corridas anteriores
  const p = paceDe(r);
  const antes = S.registros.filter(o => o.tipo === 'corrida' && o !== r && (o.data < r.data || (o.data === r.data && String(o.registrado_em) < String(r.registrado_em))));
  const out = [];
  const antPace = antes.filter(paceDe).sort((a, b) => a.data.localeCompare(b.data)).pop();
  if (p && antPace) {
    const dif = Math.round(p - paceDe(antPace));
    out.push(Math.abs(dif) < 1 ? 'Mesmo pace da anterior'
      : `${Math.abs(dif) < 60 ? Math.abs(dif) + ' s' : fmtSeg(Math.abs(dif))}/km ${dif < 0 ? 'mais rápido' : 'mais lento'} que a anterior (${fmtPace(paceDe(antPace))})`);
  }
  if (p && antes.some(paceDe) && antes.filter(paceDe).every(o => p < paceDe(o))) out.push('Melhor pace até agora');
  if (r.distancia_km > 0 && antes.some(o => o.distancia_km > 0) && antes.every(o => !(o.distancia_km >= r.distancia_km))) out.push('Maior distância até agora');
  return out;
}

  els.push(h('div', { class: 'cr-stats' },

    stat('Este mês', kmMes ? fmtKm(kmMes) : '0', 'km', `${doMes.length} corrida${doMes.length !== 1 ? 's' : ''}`)));

function abrirCorridaNoDia(r) {

// Linha do pace no tempo. Mais rápido fica mais alto. Toque num ponto para ver o valor.
function graficoPace(lista) {
  const W = 320, H = 150, ml = 40, mr = 14, mt = 14, mb = 26;
  const paces = lista.map(paceDe);
  let lo = Math.min(...paces), hi = Math.max(...paces);
  if (hi - lo < 20) { const m = (hi + lo) / 2; lo = m - 10; hi = m + 10; }
  const x = i => ml + (lista.length === 1 ? (W - ml - mr) / 2 : (i * (W - ml - mr)) / (lista.length - 1));
  const y = v => mt + ((v - lo) / (hi - lo)) * (H - mt - mb); // pace menor (mais rápido) → mais alto
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, at, txt) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt != null) e.textContent = txt; return e; };
  const s = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'cr-grafico', role: 'img', 'aria-label': `Pace das últimas ${lista.length} corridas` });
  for (const v of [lo, (lo + hi) / 2, hi]) {
    s.append(el('line', { x1: ml, x2: W - mr, y1: y(v), y2: y(v), class: 'cr-grade-l' }));
    s.append(el('text', { x: ml - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'cr-eixo' }, fmtPace(v)));
  }
  s.append(el('text', { x: ml, y: H - 6, class: 'cr-eixo' }, fmtData(lista[0].data).slice(0, 5)));
  s.append(el('text', { x: W - mr, y: H - 6, 'text-anchor': 'end', class: 'cr-eixo' }, fmtData(lista[lista.length - 1].data).slice(0, 5)));
  s.append(el('polyline', { points: lista.map((r, i) => `${x(i)},${y(paces[i])}`).join(' '), class: 'cr-linha' }));
  const dica = h('p', { class: 'muted cr-dica' }, 'Toque num ponto para ver a corrida.');
  lista.forEach((r, i) => {
    const ultimo = i === lista.length - 1;
    s.append(el('circle', { cx: x(i), cy: y(paces[i]), r: 4, class: 'cr-ponto' + (ultimo ? ' ultimo' : '') }));
    const alvo = el('circle', { cx: x(i), cy: y(paces[i]), r: 16, class: 'cr-alvo', tabindex: '0' });
    alvo.append(el('title', {}, `${fmtData(r.data).slice(0, 5)}: ${fmtPace(paces[i])} /km`));
    const mostrar = () => { dica.textContent = `${cap(NOMES_DIA_CURTO[diaDaSemana(r.data)])}, ${fmtData(r.data).slice(0, 5)} · ${textoCorrida(r)}`; };
    alvo.addEventListener('click', mostrar);
    alvo.addEventListener('mouseenter', mostrar);
    alvo.addEventListener('focus', mostrar);
    s.append(alvo);
  });
  return h('div', { class: 'cr-graf-box' }, h('div', { class: 'hist-nome' }, 'Pace (min/km) — mais alto é mais rápido'), s, dica);
}

function ordemNoDia(diaId) {
  const m = new Map();
  (diaPorId(diaId)?.exercicios ?? []).forEach((x, i) => m.set(x.id, i));
  return id => (m.has(id) ? m.get(id) : 999);
}

function histPorData() {
  const sessPorChave = new Map(agrupar(Sessao.finalizadas(), s => `${s.data}|${s.dia}`));
  const porChave = new Map(agrupar(S.registros, r => `${r.data}|${r.dia}`));
  for (const k of sessPorChave.keys()) if (!porChave.has(k)) porChave.set(k, []); // sessão sem série também aparece
  const grupos = [...porChave.entries()]
    .sort(([a], [b]) => (a.slice(0, 10) === b.slice(0, 10) ? a.localeCompare(b) : b.localeCompare(a)));
  return grupos.map(([k, regs]) => {
    const [data, diaId] = k.split('|');
    const dia = diaPorId(diaId);
    const ordem = ordemNoDia(diaId);
    const sess = (sessPorChave.get(k) || []).sort((a, b) => Date.parse(a.inicio) - Date.parse(b.inicio));
    const semanas = [...new Set([...regs, ...sess].map(r => r.semana))].join('/');
    const cors = regs.filter(r => r.tipo === 'corrida'), series = regs.filter(r => r.tipo !== 'corrida');
    const porEx = agrupar(series, r => r.exercicio).sort(([a], [b]) => ordem(a) - ordem(b));
    return h('section', { class: 'card', 'data-data': data },
      h('h3', null, `${cap(NOMES_DIA_CURTO[diaDaSemana(data)])}, ${fmtData(data)}`),
      h('p', { class: 'muted' }, `${dia ? dia.nome : 'Dia ' + diaId} · semana ${semanas} · ${series.length} série${series.length !== 1 ? 's' : ''}${cors.length ? ' · corrida' : ''}`),
      sess.map(blocoSessaoHist),
      cors.map(r => h('div', { class: 'hist-ex' }, h('div', { class: 'hist-nome' }, 'Corrida'),
        h('div', { class: 'chips' }, h('button', { type: 'button', class: 'chip', onclick: () => abrirCorridaNoDia(r) }, textoCorrida(r))),
        linhaExtrasCorrida(r) && h('p', { class: 'muted' }, linhaExtrasCorrida(r)))),
      porEx.map(([exId, rs]) => h('div', { class: 'hist-ex' },
        h('div', { class: 'hist-nome' }, nomeExercicio(exId)),
        h('div', { class: 'chips' }, rs.sort((a, b) => a.serie - b.serie).map(r =>
          h('button', { type: 'button', class: 'chip', onclick: () => abrirEdicao(r.id) }, textoSerie(r)))))),
      h('button', { type: 'button', class: 'btn-bloco', onclick: () => {
        UI.data = data; UI.dataManual = data !== hoje(); UI.diaId = dia ? diaId : diaPadrao(data); irPara('hoje');
      } }, 'Abrir este dia na tela Hoje'));
  });
}

function blocoSessaoHist(s) {
  const dor = s.dor?.houve ? `Dor: sim${s.dor.obs ? ' — ' + s.dor.obs : ''}` : 'Dor: não';
  return h('div', { class: 'hist-sessao' },

}

function histPorExercicio() {
  const mapa = exerciciosRegistraveis();
  const temCorrida = S.registros.some(r => r.tipo === 'corrida') || diasDoPlano().some(d => d.exercicios.some(x => x.tipo === 'corrida'));
  const comReg = new Set(S.registros.filter(r => r.tipo !== 'corrida').map(r => r.exercicio));
  if (S.registros.some(r => r.tipo === 'corrida')) comReg.add('corrida');
  const opcoes = temCorrida ? [['corrida', 'Corrida']] : [];
  opcoes.push(...[...mapa.values()].map(x => [x.id, x.nome]));
  for (const id of comReg) if (id !== 'corrida' && !mapa.has(id)) opcoes.push([id, `${id} (fora do plano)`]);
  if (!opcoes.some(o => o[0] === UI.histEx)) UI.histEx = (opcoes.find(o => comReg.has(o[0])) || opcoes[0])?.[0];

  const sel = h('select', { 'aria-label': 'Exercício', onchange: e => { UI.histEx = e.target.value; render(false); } },
    opcoes.map(([id, nome]) => h('option', { value: id, selected: id === UI.histEx }, nome + (comReg.has(id) ? '' : ' — sem registros'))));
  if (UI.histEx === 'corrida') return [h('section', { class: 'card' }, sel, ...histCorrida())];
  const regs = S.registros.filter(r => r.exercicio === UI.histEx && r.tipo !== 'corrida');
  const card = h('section', { class: 'card' }, sel);
  if (!regs.length) { card.append(h('p', { class: 'muted' }, 'Sem registros deste exercício.')); return [card]; }

  const comCarga = regs.filter(r => r.carga_kg != null);
  if (comCarga.length) {
    const top = comCarga.reduce((m, r) => (r.carga_kg > m.carga_kg ? r : m));
    card.append(h('p', { class: 'muted' }, `Maior carga: ${fmtKg(top.carga_kg)} kg em ${fmtData(top.data)}`));
  }
  const porData = agrupar(regs, r => r.data).sort(([a], [b]) => b.localeCompare(a));
  for (const [data, rs] of porData) {
    card.append(h('div', { class: 'hist-ex' },
      h('div', { class: 'hist-nome' }, `${fmtData(data)} · semana ${[...new Set(rs.map(r => r.semana))].join('/')}`),
      h('div', { class: 'chips' }, rs.sort((a, b) => a.serie - b.serie).map(r =>
        h('button', { type: 'button', class: 'chip', onclick: () => abrirEdicao(r.id) }, `${r.serie}ª: ${textoSerie(r)}`)))));
  }
  return [card];
}

/* ==========================================================================
   BACKUP (exportar/importar tudo em JSON; aviso após 14 dias sem exportar)
   ========================================================================== */
function montarBackup() {
  // versao_backup 2 (1.1.0): + "sessoes". Backup 1 (sem sessoes) continua restaurando.
  return { app: APP_ID, tipo: 'backup', versao_backup: 2, versao_app: APP_VERSAO, exportado_em: dataHoraLocal(),
    plano: S.plano, config: S.config, registros: S.registros, sessoes: S.sessoes };
}
function arquivoBackup() {
  return { json: JSON.stringify(montarBackup(), null, 2), nome: `treino-backup-${hoje()}.json` };
}
function marcarExport() { S.config.ultimo_export = dataHoraLocal(); salvarConfig(); render(); }

function baixarBackup() {
  const { json, nome } = arquivoBackup();
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = h('a', { href: url, download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  marcarExport();
  toast(`Backup gerado: ${nome}`);
}
function podeCompartilharArquivo() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'teste.json', { type: 'application/json' })] })); }
  catch { return false; }
}
async function compartilharBackup() {
  const { json, nome } = arquivoBackup();
  try {
    await navigator.share({ files: [new File([json], nome, { type: 'application/json' })] });
    marcarExport();
    toast('Backup enviado ✓');
  } catch (e) {
    if (e.name !== 'AbortError') toast(`Não deu para compartilhar: ${e.message}`, 'erro');
  }
}

function diasSemBackup() {
  const ref = S.config.ultimo_export || S.config.criado_em;
  return ref ? diasEntre(ref.slice(0, 10), hoje()) : null;
}
function avisoBackup() {
  const d = diasSemBackup();
  if (!S.registros.length || d == null || d <= DIAS_AVISO_BACKUP) return null;
  return h('div', { class: 'aviso warn' },
    h('b', null, S.config.ultimo_export ? `Faz ${d} dias que você não exporta o backup.` : `Você usa o app há ${d} dias e ainda não exportou nenhum backup.`),
    ' Se o navegador apagar os dados, o backup é a única cópia.',
    h('button', { type: 'button', class: 'btn-pri btn-bloco', onclick: () => irPara('ajustes', 'sec-backup') }, 'Fazer backup'));
}

function validarBackup(b) {
  const erros = [];
  if (!b || typeof b !== 'object' || Array.isArray(b)) return ['o conteúdo não é um objeto JSON.'];
  if (b.app !== APP_ID || b.tipo !== 'backup') {
    if (Array.isArray(b.dias)) return ['este arquivo parece ser um PLANO (treino.json), não um backup. Use "Importar plano".'];
    return ['não é um backup deste app (faltam "app": "treino-pwa" e "tipo": "backup").'];
  }
  if (!Array.isArray(b.registros)) erros.push('"registros" deve ser uma lista.');
  else b.registros.forEach((r, i) => {
    if (erros.length >= 10) return;
    const p = [];
    if (!r || typeof r !== 'object') p.push('não é objeto');
    else {
      if (typeof r.data !== 'string' || !RE_DATA.test(r.data)) p.push('data');
      if (typeof r.dia !== 'string') p.push('dia');
      if (typeof r.exercicio !== 'string') p.push('exercicio');
      if ((r.reps != null || r.duracao_s != null) && !ehInt(r.serie)) p.push('serie');
    }
    if (p.length) erros.push(`registros[${i}]: campo(s) inválido(s): ${p.join(', ')}.`);
  });
  if (b.plano != null) {
    const v = validarPlano(b.plano);
    if (v.erros.length) erros.push(`o plano dentro do backup é inválido: ${v.erros.slice(0, 3).join(' | ')}`);
  }
  if (b.config != null && (typeof b.config !== 'object' || Array.isArray(b.config))) erros.push('"config" deve ser um objeto.');
  if (b.sessoes != null && !Array.isArray(b.sessoes)) erros.push('"sessoes" deve ser uma lista.');
  else if (b.sessoes) b.sessoes.forEach((s, i) => {
    if (erros.length >= 10) return;
    const p = [];
    if (!s || typeof s !== 'object') p.push('não é objeto');
    else {
      if (typeof s.id !== 'string' || !s.id) p.push('id');
      if (typeof s.data !== 'string' || !RE_DATA.test(s.data)) p.push('data');
      if (typeof s.dia !== 'string') p.push('dia');
      if (typeof s.inicio !== 'string' || Number.isNaN(Date.parse(s.inicio))) p.push('inicio');
      if (s.fim != null && (typeof s.fim !== 'string' || Number.isNaN(Date.parse(s.fim)))) p.push('fim');
    }
    if (p.length) erros.push(`sessoes[${i}]: campo(s) inválido(s): ${p.join(', ')}.`);
  });
  return erros;
}

function importarBackup(b, saida) {
  const erros = validarBackup(b);
  if (erros.length) return mostrarErros(saida, 'O backup não foi restaurado:', erros);
  const quando = typeof b.exportado_em === 'string' ? fmtData(b.exportado_em) : 'data desconhecida';
  const nSess = Array.isArray(b.sessoes) ? b.sessoes.length : 0;
  if (!confirm(`Restaurar o backup de ${quando} com ${b.registros.length} registro(s) e ${nSess} sessão(ões)?\n\nIsso SUBSTITUI tudo o que está no app agora (${S.registros.length} registro(s) e ${S.sessoes.length} sessão(ões)).`)) return;

  S.plano = b.plano ?? S.plano;
  S.config = Object.assign({}, CONFIG_PADRAO, b.config || {});
  if (typeof b.exportado_em === 'string') S.config.ultimo_export = b.exportado_em;
  if (!S.config.criado_em) S.config.criado_em = dataHoraLocal();
  S.registros = b.registros.map(r => {
    const n = Object.assign({}, r);
    if (!n.id) n.id = uid();
    if (!n.tipo) n.tipo = n.duracao_s != null ? 'tempo' : (n.reps != null ? 'forca' : n.tipo);
    return n;
  });
  S.sessoes = Array.isArray(b.sessoes) ? b.sessoes.map(s => Object.assign({}, s)) : []; // backup 1.0.0: sem sessões
  const ok = salvarPlano() & salvarConfig() & salvarRegistros() & salvarSessoes();
  UI.rascunhos = {};
  UI.diaId = diaPadrao(UI.data);
  UI.perguntouSessao = null;
  if (Sessao.emAndamento()) Sessao.rodar(); else Sessao.parar();
  toast(ok ? 'Backup restaurado ✓' : 'Backup lido, mas houve erro ao salvar.', ok ? '' : 'erro');
  irPara('hoje');
  Sessao.verificarEsquecida();
}
