/* ==========================================================================
   BACKUP (exportar/importar tudo em JSON; aviso após 14 dias sem exportar)
   ========================================================================== */
function montarBackup() {
  // versao_backup 2 (1.1.0): + "sessoes". Backup 1 (sem sessoes) continua restaurando.
  return { app: APP_ID, tipo: 'backup', versao_backup: 2, versao_app: APP_VERSAO, exportado_em: dataHoraLocal(),
    plano: S.plano, config: S.config, registros: S.registros, sessoes: S.sessoes };
}
function arquivoBackup() {
  return { json: JSON.stringify(montarBackup(), null, 2), nome: `treino-backup-${hoje()}.json` };
}
function marcarExport() { S.config.ultimo_export = dataHoraLocal(); salvarConfig(); render(); }

function baixarBackup() {
  const { json, nome } = arquivoBackup();
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = h('a', { href: url, download: nome });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  marcarExport();
  toast(`Backup gerado: ${nome}`);
}
function podeCompartilharArquivo() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'teste.json', { type: 'application/json' })] })); }
  catch { return false; }
}
async function compartilharBackup() {
  const { json, nome } = arquivoBackup();
  try {
    await navigator.share({ files: [new File([json], nome, { type: 'application/json' })] });
    marcarExport();
    toast('Backup enviado ✓');
  } catch (e) {
    if (e.name !== 'AbortError') toast(`Não deu para compartilhar: ${e.message}`, 'erro');
  }
}

function diasSemBackup() {
  const ref = S.config.ultimo_export || S.config.criado_em;
  return ref ? diasEntre(ref.slice(0, 10), hoje()) : null;
}
function avisoBackup() {
  const d = diasSemBackup();
  if (!S.registros.length || d == null || d <= DIAS_AVISO_BACKUP) return null;
  return h('div', { class: 'aviso warn' },
    h('b', null, S.config.ultimo_export ? `Faz ${d} dias que você não exporta o backup.` : `Você usa o app há ${d} dias e ainda não exportou nenhum backup.`),
    ' Se o navegador apagar os dados, o backup é a única cópia.',
    h('button', { type: 'button', class: 'btn-pri btn-bloco', onclick: () => irPara('ajustes', 'sec-backup') }, 'Fazer backup'));
}

function validarBackup(b) {
  const erros = [];
  if (!b || typeof b !== 'object' || Array.isArray(b)) return ['o conteúdo não é um objeto JSON.'];
  if (b.app !== APP_ID || b.tipo !== 'backup') {
    if (Array.isArray(b.dias)) return ['este arquivo parece ser um PLANO (treino.json), não um backup. Use "Importar plano".'];
    return ['não é um backup deste app (faltam "app": "treino-pwa" e "tipo": "backup").'];
  }
  if (!Array.isArray(b.registros)) erros.push('"registros" deve ser uma lista.');
  else b.registros.forEach((r, i) => {
    if (erros.length >= 10) return;
    const p = [];
    if (!r || typeof r !== 'object') p.push('não é objeto');
    else {
      if (typeof r.data !== 'string' || !RE_DATA.test(r.data)) p.push('data');
      if (typeof r.dia !== 'string') p.push('dia');
      if (typeof r.exercicio !== 'string') p.push('exercicio');
      if ((r.reps != null || r.duracao_s != null) && !ehInt(r.serie)) p.push('serie');
    }
    if (p.length) erros.push(`registros[${i}]: campo(s) inválido(s): ${p.join(', ')}.`);
  });
  if (b.plano != null) {
    const v = validarPlano(b.plano);
    if (v.erros.length) erros.push(`o plano dentro do backup é inválido: ${v.erros.slice(0, 3).join(' | ')}`);
  }
  if (b.config != null && (typeof b.config !== 'object' || Array.isArray(b.config))) erros.push('"config" deve ser um objeto.');
  if (b.sessoes != null && !Array.isArray(b.sessoes)) erros.push('"sessoes" deve ser uma lista.');
  else if (b.sessoes) b.sessoes.forEach((s, i) => {
    if (erros.length >= 10) return;
    const p = [];
    if (!s || typeof s !== 'object') p.push('não é objeto');
    else {
      if (typeof s.id !== 'string' || !s.id) p.push('id');
      if (typeof s.data !== 'string' || !RE_DATA.test(s.data)) p.push('data');
      if (typeof s.dia !== 'string') p.push('dia');
      if (typeof s.inicio !== 'string' || Number.isNaN(Date.parse(s.inicio))) p.push('inicio');
      if (s.fim != null && (typeof s.fim !== 'string' || Number.isNaN(Date.parse(s.fim)))) p.push('fim');
    }
    if (p.length) erros.push(`sessoes[${i}]: campo(s) inválido(s): ${p.join(', ')}.`);
  });
  return erros;
}

function importarBackup(b, saida) {
  const erros = validarBackup(b);
  if (erros.length) return mostrarErros(saida, 'O backup não foi restaurado:', erros);
  const quando = typeof b.exportado_em === 'string' ? fmtData(b.exportado_em) : 'data desconhecida';
  const nSess = Array.isArray(b.sessoes) ? b.sessoes.length : 0;
  if (!confirm(`Restaurar o backup de ${quando} com ${b.registros.length} registro(s) e ${nSess} sessão(ões)?\n\nIsso SUBSTITUI tudo o que está no app agora (${S.registros.length} registro(s) e ${S.sessoes.length} sessão(ões)).`)) return;

  S.plano = b.plano ?? S.plano;
  S.config = Object.assign({}, CONFIG_PADRAO, b.config || {});
  if (typeof b.exportado_em === 'string') S.config.ultimo_export = b.exportado_em;
  if (!S.config.criado_em) S.config.criado_em = dataHoraLocal();
  S.registros = b.registros.map(r => {
    const n = Object.assign({}, r);
    if (!n.id) n.id = uid();
    if (!n.tipo) n.tipo = n.duracao_s != null ? 'tempo' : (n.reps != null ? 'forca' : n.tipo);
    return n;
  });
  S.sessoes = Array.isArray(b.sessoes) ? b.sessoes.map(s => Object.assign({}, s)) : []; // backup 1.0.0: sem sessões
  const ok = salvarPlano() & salvarConfig() & salvarRegistros() & salvarSessoes();
  UI.rascunhos = {};
  UI.diaId = diaPadrao(UI.data);
  UI.perguntouSessao = null;
  if (Sessao.emAndamento()) Sessao.rodar(); else Sessao.parar();
  toast(ok ? 'Backup restaurado ✓' : 'Backup lido, mas houve erro ao salvar.', ok ? '' : 'erro');
  irPara('hoje');
  Sessao.verificarEsquecida();
}

/* ==========================================================================
   AJUSTES (plano, semana, backup, alertas, dados)
   ========================================================================== */
function widgetImportar(tipo) {
  const saida = h('div');
  const inFile = h('input', { type: 'file', hidden: true });
  inFile.addEventListener('change', async () => {
    const f = inFile.files?.[0];
    inFile.value = '';
    if (!f) return;
    try { processarImportacao(tipo, await f.text(), saida, f.name); }
    catch (e) { mostrarErros(saida, 'Não consegui ler o arquivo.', [e.message]); }
  });
  const ta = h('textarea', { autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', autocomplete: 'off',
    placeholder: tipo === 'plano' ? 'Cole aqui o conteúdo do treino.json' : 'Cole aqui o conteúdo do arquivo de backup' });
  return h('div', null,
    h('button', { type: 'button', class: 'btn-pri btn-bloco', onclick: () => inFile.click() },
      tipo === 'plano' ? 'Selecionar treino.json' : 'Selecionar arquivo de backup'),
    inFile,
    h('details', null, h('summary', null, 'ou colar o texto'), ta,
      h('button', { type: 'button', class: 'btn-bloco', onclick: () => processarImportacao(tipo, ta.value, saida) }, 'Validar e importar')),
    saida);
}
function processarImportacao(tipo, texto, saida, nomeArq) {
  const { obj, erro } = lerJSON(texto);
  if (erro) return mostrarErros(saida, nomeArq ? `"${nomeArq}" não foi importado.` : 'Nada foi importado.', [erro]);
  if (tipo === 'plano') importarPlano(obj, saida); else importarBackup(obj, saida);
}
function mostrarErros(saida, titulo, erros) {
  saida.replaceChildren(h('div', { class: 'aviso erro', role: 'alert' }, h('b', null, titulo),
    h('ul', null, erros.slice(0, 30).map(e => h('li', null, e))),
    erros.length > 30 && h('p', null, `… e mais ${erros.length - 30}.`)));
  saida.scrollIntoView?.({ block: 'nearest', behavior: 'smooth' });
}

function viewBoasVindas() {
  return [
    h('h1', null, 'Treino'),
    UI.planoInvalido && h('div', { class: 'aviso erro' }, h('b', null, 'O plano salvo no app ficou inválido. Importe de novo:'),
      h('ul', null, UI.planoInvalido.slice(0, 10).map(e => h('li', null, e)))),
    !Armaz.disponivel && h('div', { class: 'aviso erro' }, 'Este navegador não deixa salvar dados (modo privado?). Abra o app instalado ou fora do modo privado.'),
    h('section', { class: 'card destaque' },
      h('h2', null, 'Importe o plano'),
      h('p', { class: 'muted' }, 'Selecione o arquivo treino.json ou cole o texto dele. O treino vem todo do arquivo.'),
      widgetImportar('plano')),
    h('section', { class: 'card' },
      h('h2', null, 'Já usava o app em outro aparelho?'),
      h('p', { class: 'muted' }, 'Restaure um backup (traz plano, ajustes e registros).'),
      widgetImportar('backup'))
  ];
}

function viewAjustes() {
  const els = [h('h1', null, 'Ajustes')];
  const p = S.plano, nEx = p.dias.reduce((s, d) => s + d.exercicios.length, 0);
  const { avisos } = validarPlano(p);

  // Plano
  els.push(h('section', { class: 'card', id: 'sec-plano' },
    h('h2', null, 'Plano'),
    h('p', null, h('b', null, p.nome)),
    h('p', { class: 'muted' }, `${p.semanas} semanas · ${p.dias.length} dias · ${nEx} exercícios`,
      S.config.plano_importado_em ? ` · importado em ${fmtData(S.config.plano_importado_em)}` : ''),
    avisos.length > 0 && h('div', { class: 'aviso warn' }, h('b', null, 'Avisos do arquivo:'), h('ul', null, avisos.map(a => h('li', null, a)))),
    h('details', null, h('summary', null, 'Trocar o plano (importar outro treino.json)'),
      h('p', { class: 'muted' }, 'Os registros ficam. Exercícios com o mesmo "id" continuam com o histórico.'),
      widgetImportar('plano'))));

  // Semana
  const sug = semanaPelaData(hoje()), atual = semanaEm(hoje()), N = totalSemanas();
  const inInicio = h('input', { type: 'date', value: S.config.data_inicio || '', 'aria-label': 'Data de início do plano' });
  inInicio.addEventListener('change', () => {
    if (inInicio.value && !RE_DATA.test(inInicio.value)) return;
    definirInicio(inInicio.value || null);
    toast(inInicio.value ? `Início: ${fmtData(inInicio.value)}` : 'Sem data de início');
    render();
  });
  let txtSug;
  if (sug == null) txtSug = 'Sem data de início: a semana é escolhida só manualmente.';
  else if (sug < 1) txtSug = `O plano ainda não começou (início em ${fmtData(S.config.data_inicio)}). Sugestão: semana 1.`;
  else if (sug > N) txtSug = `Pela data, as ${N} semanas já passaram.`;
  else txtSug = `Sugestão pela data: semana ${sug}.`;
  const aj = S.config.ajuste_semana || 0;
  els.push(h('section', { class: 'card', id: 'sec-semana' },
    h('h2', null, 'Semana'),
    h('label', { class: 'rotulo' }, 'Data de início do plano', inInicio),
    h('p', { class: 'muted' }, txtSug),
    h('div', { class: 'stepper' },
      h('button', { type: 'button', 'aria-label': 'Semana anterior', disabled: atual <= 1, onclick: () => { definirSemana(atual - 1); render(); } }, '−'),
      h('div', { class: 'valor' }, 'Semana ', h('b', null, atual), ` de ${N}`),
      h('button', { type: 'button', 'aria-label': 'Próxima semana', disabled: atual >= N, onclick: () => { definirSemana(atual + 1); render(); } }, '+')),
    aj !== 0 && h('div', { class: 'aviso info' },
      `Ajuste manual: ${Math.abs(aj)} semana${Math.abs(aj) > 1 ? 's' : ''} ${aj < 0 ? 'atrás' : 'à frente'} da sugestão. O ajuste continua valendo nas próximas semanas.`,
      h('button', { type: 'button', class: 'btn-bloco', onclick: () => { S.config.ajuste_semana = 0; salvarConfig(); render(); } }, 'Voltar para a sugestão')),
    h('p', { class: 'muted' }, 'Repetiu uma semana? Toque em −. O app passa a contar a partir daí.')));

  // Backup
  const d = diasSemBackup();
  els.push(h('section', { class: 'card', id: 'sec-backup' },
    h('h2', null, 'Backup'),
    h('p', null, S.config.ultimo_export
      ? `Último backup: ${fmtData(S.config.ultimo_export)} (${d === 0 ? 'hoje' : `há ${d} dia${d > 1 ? 's' : ''}`}).`
      : 'Nenhum backup exportado ainda.'),
    h('p', { class: 'muted' }, `Leva plano, ajustes, ${S.registros.length} registro(s) e ${S.sessoes.length} sessão(ões). Guarde fora do celular (Drive, e-mail, computador).`),
    h('button', { type: 'button', class: 'btn-pri btn-bloco', onclick: baixarBackup }, 'Baixar backup (.json)'),
    podeCompartilharArquivo() && h('button', { type: 'button', class: 'btn-bloco', onclick: compartilharBackup }, 'Compartilhar / salvar em…'),
    h('details', null, h('summary', null, 'Restaurar backup'),
      h('p', { class: 'muted' }, 'Substitui tudo o que está no app pelo conteúdo do backup.'),
      widgetImportar('backup'))));

  // Alertas
  const temVibracao = typeof navigator.vibrate === 'function';
  const chk = (rotulo, campo, desabilitado) => {
    const c = h('input', { type: 'checkbox', checked: !!S.config[campo], disabled: desabilitado });
    c.addEventListener('change', () => { S.config[campo] = c.checked; salvarConfig(); });
    return h('label', { class: 'linha-check' }, c, rotulo);
  };
  els.push(h('section', { class: 'card', id: 'sec-alertas' },
    h('h2', null, 'Alertas do descanso'),
    chk('Som', 'som'),
    chk(temVibracao ? 'Vibração' : 'Vibração (este navegador não suporta)', 'vibracao', !temVibracao),
    h('button', { type: 'button', class: 'btn-bloco', onclick: () => { Som.desbloquear(); setTimeout(() => alertar('min'), 60); } }, 'Testar alerta'),
    h('p', { class: 'muted' }, 'O alerta toca ao atingir o descanso mínimo e de novo no máximo. A tela fica acesa enquanto o timer roda, quando o aparelho permite. No iPhone não há vibração pelo navegador, e com o modo silencioso ligado o som pode não tocar.')));

  // Dados
  els.push(h('section', { class: 'card', id: 'sec-dados' },
    h('h2', null, 'Dados neste aparelho'),
    h('p', null, `${S.registros.length} registro(s). Armazenamento persistente: `,
      UI.persistido === true ? 'sim' : UI.persistido === false ? 'não concedido' : UI.persistido === null ? 'não suportado' : 'verificando…'),
    h('p', { class: 'muted' }, 'Tudo fica só no celular. Sem login, sem servidor, sem rastreamento.'),
    h('button', { type: 'button', class: 'btn-perigo btn-bloco', onclick: apagarTudo }, 'Apagar todos os dados')));

  els.push(h('p', { class: 'muted', style: 'text-align:center' }, `Versão ${APP_VERSAO}`));
  return els;
}

function apagarTudo() {
  if (!confirm('Apagar plano, ajustes e TODOS os registros deste aparelho?')) return;
  if (!confirm('Tem certeza? Sem backup, não dá para recuperar.')) return;
  Timer.parar(); Sessao.parar();
  Object.values(CHAVES).forEach(k => Armaz.apagar(k));
  S.plano = null; S.config = Object.assign({}, CONFIG_PADRAO); S.registros = []; S.sessoes = [];
  UI.rascunhos = {}; UI.aba = 'hoje';
  toast('Dados apagados');
  render(false);
}

/* ==========================================================================
   APP (navegação, inicialização, service worker)
   ========================================================================== */
function irPara(aba, secao) { UI.aba = aba; UI.secaoAlvo = secao || null; render(false); }

function render(manterScroll = true) {
  const y = window.scrollY;
  let conteudo;
  if (!S.plano) conteudo = viewBoasVindas();
  else if (UI.aba === 'historico') conteudo = viewHistorico();
  else if (UI.aba === 'ajustes') conteudo = viewAjustes();
  else conteudo = viewHoje();
  $('#main').replaceChildren(...[].concat(conteudo).filter(Boolean));
  $('#nav').hidden = !S.plano;
  for (const b of document.querySelectorAll('#nav button')) b.classList.toggle('ativo', b.dataset.aba === UI.aba);
  desenharBarraSessao();
  Timer.desenhar();
  if (UI.secaoAlvo) {
    const alvo = document.getElementById(UI.secaoAlvo);
    UI.secaoAlvo = null;
    if (alvo) { alvo.scrollIntoView({ block: 'start' }); return; }
  }
  window.scrollTo(0, manterScroll ? y : 0);
}

function registrarSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    UI.swReg = reg;
    const oferecer = w => { UI.swEsperando = w; $('#banner-update').hidden = false; };
    if (reg.waiting && navigator.serviceWorker.controller) oferecer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) oferecer(w); });
    });
  }).catch(e => console.warn('service worker', e));
  // Só recarrega quando você toca em "Atualizar" (nunca no meio do treino sem pedir)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (UI.atualizando) location.reload(); });
}

let ultimaChecagemSW = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Tela.quer) Tela.manter(true);
  Timer.tick();
  Sessao.tick();
  Sessao.verificarEsquecida();
  if (!UI.dataManual && UI.data !== hoje()) { UI.data = hoje(); UI.diaId = diaPadrao(UI.data); render(); } // virou o dia com o app aberto
  if (UI.swReg && Date.now() - ultimaChecagemSW > 30 * 60 * 1000) { ultimaChecagemSW = Date.now(); UI.swReg.update().catch(() => {}); }
});

(function iniciar() {
  if (S.plano) {
    const v = validarPlano(S.plano);
    if (v.erros.length) { UI.planoInvalido = v.erros; S.plano = null; }
  }
  UI.diaId = diaPadrao(UI.data);
  document.addEventListener('pointerdown', () => Som.desbloquear(), { passive: true });
  for (const b of document.querySelectorAll('#nav button')) b.addEventListener('click', () => irPara(b.dataset.aba));
  $('#timer .t-parar').addEventListener('click', () => Timer.parar());
  $('#btn-atualizar').addEventListener('click', () => {
    UI.atualizando = true;
    if (UI.swEsperando) UI.swEsperando.postMessage('pular-espera'); else location.reload();
  });
  if (Timer.st) {
    if (!Timer.st.inicio || Timer.decorrido() > Timer.st.max + 180) Timer.parar();
    else { Tela.manter(true); Timer.rodar(); }
  }
  if (Sessao.emAndamento()) Sessao.rodar(); // sessão em andamento sobrevive a fechar o app e reiniciar o celular
  render(false);
  Sessao.verificarEsquecida();
  pedirPersistencia().then(() => { if (UI.aba === 'ajustes') render(); });
  registrarSW();
})();
</script>
