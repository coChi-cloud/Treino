/* ==========================================================================
   RELATÓRIO DA CORRIDA — 1.6.0: imagem (PNG) para salvar ou compartilhar, em quatro formatos.
   Desenhado no aparelho, em canvas, sem internet. Usa o "detalhe" guardado ao importar o arquivo
   do relógio (batimentos, ritmo e percurso a cada 5 s). Sem detalhe, mostra só os totais.
   ========================================================================== */
const MESES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const REL_COR = { fundo: '#070708', txt: '#F5F5F7', muted: '#A1A1A6', vivo: '#FF5A36' };
const REL_FORMATOS = [
  { id: 'painel', nome: 'Painel', w: 1080, h: 1920 }, // 1.7.0: o mesmo desenho do vídeo, no último quadro
  { id: 'stories', nome: 'Stories', w: 1080, h: 1920 },
  { id: 'feed', nome: 'Feed', w: 1080, h: 1350 },
  { id: 'poster', nome: 'Pôster', w: 1080, h: 1350 },
  { id: 'detalhado', nome: 'Detalhado', w: 1080, h: null } // altura conforme o conteúdo
];
const REL_M = 84; // margem lateral

// ---------- análise: transforma o registro em números prontos para desenhar ----------
function analisarCorrida(r) {
  const d = r.detalhe && r.detalhe.v === 1 && Array.isArray(r.detalhe.vel) && r.detalhe.vel.length > 10 ? r.detalhe : null;
  const a = {
    r, d, km: r.distancia_km > 0 ? r.distancia_km : null, t: tempoDe(r), pace: paceDe(r),
    fcm: r.fc_media ?? null, fcx: r.fc_max ?? null, kcal: r.calorias ?? null, cad: r.cadencia_spm ?? null,
    subida: r.subida_m ?? null, fonte: r.fonte ?? null, passo: d?.passo || PASSO_DETALHE, ritmo: [], parciais: [], rota: null, retorno: null,
    fcs: null, zonas: null, alts: null
  };
  if (!d) return a;
  const n = d.vel.length, p = a.passo;
  const bruto = [0];
  const comGps = d.lat.filter(v => v != null).length >= n * 0.9;
  if (comGps) { // distância andada entre as posições de cada bloco de 5 s
    const kx = 111320 * Math.cos((d.lat.find(v => v != null) / 1e5 * Math.PI) / 180);
    let ant = null;
    for (let i = 0; i < n; i++) {
      const la = d.lat[i], lo = d.lon[i];
      let passoM = 0;
      if (la != null && lo != null) { if (ant) passoM = Math.hypot(((lo - ant[1]) / 1e5) * kx, ((la - ant[0]) / 1e5) * 110540); ant = [la, lo]; }
      bruto.push(bruto[i] + passoM);
    }
  } else for (let i = 0; i < n; i++) bruto.push(bruto[i] + ((d.vel[i] ?? 0) / 100) * p);
  const k = a.km && bruto[n] > 0 ? (a.km * 1000) / bruto[n] : 1; // ajusta o GPS à distância oficial do relógio
  a.dist = bruto.map(v => v * k);
  const total = a.dist[n];
  const tempoEm = m => { // segundo (desde o início) em que passou pelo metro m
    let i = 0;
    while (i < n - 1 && a.dist[i + 1] < m) i++;
    const d0 = a.dist[i], d1 = a.dist[i + 1];
    return (i + (d1 > d0 ? Math.min(1, Math.max(0, (m - d0) / (d1 - d0))) : 0)) * p;
  };
  a.tempoEm = tempoEm;
  const fcEntre = (t0, t1) => {
    const v = (d.fc || []).slice(Math.floor(t0 / p), Math.max(Math.floor(t0 / p) + 1, Math.ceil(t1 / p))).filter(ehNum);
    return v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length) : null;
  };
  for (let m = 250; m <= total + 0.5; m += 250) a.ritmo.push({ m, pace: (tempoEm(m) - tempoEm(m - 250)) / 0.25 });
  // parciais por km: usa as voltas do relógio quando existem; senão calcula pelo GPS
  if (d.parciais?.length) {
    let t0 = 0;
    for (const v of d.parciais) {
      if (v.m >= 100 && v.s > 0) a.parciais.push({ m: v.m, s: v.s, pace: v.s / (v.m / 1000), fc: v.fc ?? fcEntre(t0, t0 + v.s) });
      t0 += v.s;
    }
  } else {
    for (let m = 1000, ini = 0; ini < total - 100; m += 1000) {
      const fim = Math.min(m, total), t0 = tempoEm(ini), t1 = tempoEm(fim);
      a.parciais.push({ m: fim - ini, s: t1 - t0, pace: (t1 - t0) / ((fim - ini) / 1000), fc: fcEntre(t0, t1) });
      ini = fim;
    }
  }
  a.fcs = (d.fc || []).some(ehNum) ? d.fc : null;
  if (Array.isArray(d.zonas) && d.zonas.length >= 6 && d.zonas.slice(1).some(v => v > 0)) a.zonas = d.zonas.slice(1, 6);
  if (Array.isArray(d.alt) && d.alt.some(ehNum)) a.alts = d.alt.map(v => (v == null ? null : v / 10));
  // percurso: projeção simples em metros; o primeiro ponto é a largada
  const pts = [];
  d.lat.forEach((la, i) => { if (la != null && d.lon[i] != null) pts.push({ i, la: la / 1e5, lo: d.lon[i] / 1e5 }); });
  if (pts.length >= 10) {
    const la0 = pts[0].la, lo0 = pts[0].lo, kx = 111320 * Math.cos((la0 * Math.PI) / 180);
    a.rota = pts.map(q => ({ i: q.i, x: (q.lo - lo0) * kx, y: (q.la - la0) * 110540 }));
    let far = 0, dfar = 0;
    a.rota.forEach((q, j) => { const dd = Math.hypot(q.x, q.y); if (dd > dfar) { dfar = dd; far = j; } });
    const fim = a.rota[a.rota.length - 1], dfim = Math.hypot(fim.x, fim.y);
    if (far < a.rota.length * 0.9 && dfim < dfar * 0.6) a.retorno = { j: far, m: a.dist[a.rota[far].i] };
  }
  return a;
}

function relDataTxt(a) {
  const [y, m, d] = partes(a.r.data);
  return `${NOMES_DIA[diaDaSemana(a.r.data)]}, ${d} ${MESES_CURTO[m - 1]} ${y}`;
}
const relHora = a => (a.r.inicio_relogio ? fmtHora(a.r.inicio_relogio).replace(':', 'h') : null);
const relKm1 = m => (Math.round(m / 100) / 10).toFixed(1).replace('.', ',');

// ---------- peças de desenho ----------
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function relTexto(c, s, x, y, { px = 30, peso = 600, cor = REL_COR.txt, al = 'left', ls = 0, num = false } = {}) {
  c.font = `${num ? 500 : peso} ${px}px ${num ? '"Barlow Condensed"' : 'Inter'}, system-ui, sans-serif`;
  c.fillStyle = cor; c.textAlign = al; c.textBaseline = 'alphabetic';
  if ('letterSpacing' in c) c.letterSpacing = ls ? ls + 'px' : '0px';
  c.fillText(s, x, y);
  const w = c.measureText(s).width;
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  return w;
}
const relRotulo = (c, s, x, y, al = 'left') => relTexto(c, s.toUpperCase(), x, y, { px: 24, peso: 600, cor: REL_COR.muted, ls: 5, al });

function relFundo(c, w, h) {
  c.fillStyle = REL_COR.fundo; c.fillRect(0, 0, w, h);
  const brilho = (cx, cy, raio, rgb, al) => {
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, raio);
    g.addColorStop(0, `rgba(${rgb},${al})`); g.addColorStop(0.65, `rgba(${rgb},0)`);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  };
  brilho(w, 0, 1180, '255,255,255', 0.17);
  brilho(0, h * 0.72, 1080, '255,106,61', 0.17);
  brilho(w, h * 0.45, 800, '130,150,255', 0.12);
}
function relCartao(c, x, y, w, h, r = 52) {
  c.save();
  rr(c, x, y, w, h, r);
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.09)'); g.addColorStop(1, 'rgba(255,255,255,.04)');
  c.fillStyle = g; c.fill();
  c.lineWidth = 2; c.strokeStyle = 'rgba(255,255,255,.11)'; c.stroke();
  c.beginPath(); c.moveTo(x + r, y + 1); c.lineTo(x + w - r, y + 1);
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.stroke();
  c.restore();
}
function relCabecalho(c, a, y) {
  const hora = relHora(a);
  relTexto(c, `CORRIDA · ${relDataTxt(a).toUpperCase()}${hora ? ' · ' + hora.toUpperCase() : ''}`, REL_M, y, { px: 30, peso: 600, cor: REL_COR.muted, ls: 6 });
}
// número grande + unidade em laranja
function relHero(c, a, y, px) {
  const val = a.km != null ? fmtKm(a.km) : a.t != null ? fmtTempo(a.t) : '—';
  const w = relTexto(c, val, REL_M - 6, y, { px, num: true });
  if (a.km != null) relTexto(c, 'km', REL_M - 6 + w + px * 0.07, y, { px: px * 0.3, num: true, cor: REL_COR.vivo });
}
// linha de números com barra laranja à esquerda
function relStats(c, itens, x, y, w, { px = 110, alt = 150 } = {}) {
  const lista = itens.filter(i => i && i.val != null);
  if (!lista.length) return;
  const col = w / lista.length;
  lista.forEach((it, k) => {
    const cx = x + k * col;
    c.fillStyle = REL_COR.vivo; c.fillRect(cx, y, 4, alt);
    relRotulo(c, it.rot, cx + 26, y + 30);
    const vw = relTexto(c, it.val, cx + 26, y + alt - 6, { px, num: true });
    if (it.un) relTexto(c, it.un, cx + 26 + vw + 8, y + alt - 6, { px: 32, peso: 600, cor: REL_COR.muted });
  });
}
const relItensBase = a => [
  a.t != null && { rot: 'Tempo', val: fmtTempo(a.t) },
  a.pace && { rot: 'Ritmo médio', val: fmtPace(a.pace), un: '/km' },
  a.kcal != null ? { rot: 'Calorias', val: String(a.kcal), un: 'kcal' } : a.fcm != null ? { rot: 'FC média', val: String(a.fcm), un: 'bpm' } : null
].filter(Boolean);

// percurso: ida em laranja, volta tracejada; largada, retorno e chegada marcados
function relRota(c, a, bx, by, bw, bh, { rotulos = true, esp = 9, brilho = false } = {}) {
  const P = a.rota;
  if (!P || P.length < 2) return false;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const q of P) { x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
  const s = Math.min(bw / Math.max(x1 - x0, 1), bh / Math.max(y1 - y0, 1));
  const ox = bx + (bw - (x1 - x0) * s) / 2, oy = by + (bh - (y1 - y0) * s) / 2;
  const X = q => ox + (q.x - x0) * s, Y = q => oy + (y1 - q.y) * s;
  const k = a.retorno ? a.retorno.j : P.length - 1;
  const traco = (de, ate) => { c.beginPath(); for (let j = de; j <= ate; j++) (j === de ? c.moveTo(X(P[j]), Y(P[j])) : c.lineTo(X(P[j]), Y(P[j]))); c.stroke(); };
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (brilho) { c.shadowColor = 'rgba(255,90,54,.75)'; c.shadowBlur = 36; }
  c.strokeStyle = REL_COR.vivo; c.lineWidth = esp; traco(0, k);
  c.shadowBlur = 0;
  if (a.retorno) { c.strokeStyle = 'rgba(245,245,247,.82)'; c.lineWidth = esp * 0.55; c.setLineDash([esp * 1.7, esp * 1.5]); traco(k, P.length - 1); c.setLineDash([]); }
  const ponto = (q, cor, raio, anel) => { c.beginPath(); c.arc(X(q), Y(q), raio, 0, 7); c.fillStyle = cor; c.fill(); if (anel) { c.lineWidth = 4; c.strokeStyle = '#070708'; c.stroke(); } };
  const ini = P[0], fim = P[P.length - 1];
  if (a.retorno) ponto(P[k], '#9A9AA2', esp * 1.15, true);
  ponto(fim, '#FFFFFF', esp * 1.35, true);
  ponto(ini, REL_COR.vivo, esp * 1.5, true);
  if (rotulos) {
    const usados = [];
    const rot = (q, txt, cor) => { // testa quatro posições e fica com a que menos encosta no traço e nos outros rótulos
      c.font = '600 28px Inter, system-ui, sans-serif';
      const lw = c.measureText(txt).width;
      let melhor = null;
      for (const [dir, baixo] of [[1, true], [-1, true], [1, false], [-1, false]]) {
        const rx = dir > 0 ? X(q) + 24 : X(q) - 24 - lw, ry = Y(q) + (baixo ? 12 : -50);
        const caixa = [rx - 8, ry - 8, rx + lw + 8, ry + 46];
        let custo = 0;
        for (const o of P) { const ox = X(o), oy = Y(o); if (ox > caixa[0] && ox < caixa[2] && oy > caixa[1] && oy < caixa[3]) custo++; }
        for (const u of usados) if (caixa[0] < u[2] && caixa[2] > u[0] && caixa[1] < u[3] && caixa[3] > u[1]) custo += 1000;
        if (caixa[0] < bx - 40 || caixa[2] > bx + bw + 40) custo += 500;
        if (!melhor || custo < melhor.custo) melhor = { custo, caixa, rx, ry, dir };
      }
      usados.push(melhor.caixa);
      relTexto(c, txt, melhor.rx, melhor.ry + 30, { px: 28, peso: 600, cor });
    };
    rot(ini, 'Largada', REL_COR.txt);
    if (a.retorno) rot(P[k], `Retorno · ${relKm1(a.retorno.m)} km`, REL_COR.muted);
    rot(fim, `Chegada · ${a.km != null ? relKm1(a.km * 1000) + ' km' : ''}`, REL_COR.txt);
  }
  c.restore();
  return true;
}

// barras do ritmo a cada 250 m: mais alta = mais rápida
function relBarrasRitmo(c, a, x, y, w, h) {
  const R = a.ritmo;
  if (R.length < 2) return;
  const vel = R.map(v => 1 / v.pace), vmax = Math.max(...vel);
  const base = y + h - 46, topo = y + 70, util = base - topo;
  const slot = w / R.length, larg = slot * 0.62;
  const rapido = vel.indexOf(vmax), lento = vel.indexOf(Math.min(...vel));
  const media = a.pace ? 1 / a.pace : vel.reduce((p, q) => p + q, 0) / vel.length;
  c.fillStyle = 'rgba(255,255,255,.14)'; c.fillRect(x, base, w, 2);
  const ym0 = base - (media / vmax) * util;
  R.forEach((v, i) => {
    const bh = Math.max(8, (vel[i] / vmax) * util), bx = x + i * slot + (slot - larg) / 2;
    rr(c, bx, base - bh, larg, bh, 9);
    c.fillStyle = i === rapido ? REL_COR.vivo : i === lento ? REL_COR.txt : 'rgba(255,255,255,.26)';
    c.fill();
    if (i === rapido || i === lento || (i === R.length - 1 && Math.abs(i - lento) > 1 && Math.abs(i - rapido) > 1)) relTexto(c, fmtPace(v.pace), bx + larg / 2, (Math.abs(base - bh - 14 - ym0) < 24 ? ym0 - 22 : base - bh - 14), { px: 27, peso: 700, al: 'center', cor: i === rapido ? REL_COR.vivo : REL_COR.txt });
    if (R.length <= 14 || i % 2 === 1) relTexto(c, String(v.m), bx + larg / 2, base + 34, { px: 22, peso: 500, cor: REL_COR.muted, al: 'center' });
  });
  const ym = base - (media / vmax) * util;
  c.save(); c.setLineDash([10, 10]); c.strokeStyle = 'rgba(245,245,247,.55)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x, ym); c.lineTo(x + w, ym); c.stroke(); c.restore();
  const wm = relTexto(c, `média ${fmtPace(1 / media)}`, x + w, y + 28, { px: 25, peso: 600, cor: REL_COR.muted, al: 'right' });
  c.save(); c.setLineDash([9, 8]); c.strokeStyle = 'rgba(245,245,247,.55)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + w - wm - 62, y + 20); c.lineTo(x + w - wm - 18, y + 20); c.stroke(); c.restore();
}

// batimentos ao longo do treino
function relGraficoFC(c, a, x, y, w, h, { eixos = true } = {}) {
  const S = a.fcs;
  if (!S) return;
  const v = S.filter(ehNum), lo0 = Math.min(...v), hi0 = Math.max(...v);
  const lo = Math.floor((lo0 - 5) / 10) * 10, hi = Math.ceil((hi0 + 5) / 10) * 10;
  const ml = eixos ? 78 : 0, gx = x + ml, gw = w - ml, gy = y + (eixos ? 8 : 4), gh = h - (eixos ? 58 : 8);
  const X = i => gx + (i / (S.length - 1)) * gw, Y = f => gy + (1 - (f - lo) / (hi - lo)) * gh;
  if (eixos) {
    const passos = 3;
    for (let k = 0; k <= passos; k++) {
      const f = lo + ((hi - lo) * k) / passos, yy = Y(f);
      c.fillStyle = 'rgba(255,255,255,.10)'; c.fillRect(gx, yy, gw, 2);
      relTexto(c, String(Math.round(f)), gx - 16, yy + 8, { px: 22, peso: 500, cor: REL_COR.muted, al: 'right' });
    }
    const dur = (S.length - 1) * a.passo, marc = dur > 2400 ? 10 : 5;
    for (let m = 0; m * 60 <= dur; m += marc) relTexto(c, m === 0 ? '0' : `${m} min`, gx + (m * 60 / dur) * gw, y + h - 12, { px: 22, peso: 500, cor: REL_COR.muted, al: m === 0 ? 'left' : 'center' });
  }
  const pts = []; S.forEach((f, i) => { if (ehNum(f)) pts.push([X(i), Y(f)]); });
  c.save();
  c.beginPath(); pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py)));
  c.lineTo(pts[pts.length - 1][0], gy + gh); c.lineTo(pts[0][0], gy + gh); c.closePath();
  const g = c.createLinearGradient(0, gy, 0, gy + gh); g.addColorStop(0, 'rgba(255,90,54,.30)'); g.addColorStop(1, 'rgba(255,90,54,0)');
  c.fillStyle = g; c.fill();
  c.beginPath(); pts.forEach(([px, py], i) => (i ? c.lineTo(px, py) : c.moveTo(px, py)));
  c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = eixos ? 6 : 5; c.strokeStyle = REL_COR.vivo; c.stroke();
  if (eixos && a.fcm != null) {
    c.setLineDash([10, 10]); c.strokeStyle = 'rgba(245,245,247,.5)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(gx, Y(a.fcm)); c.lineTo(gx + gw, Y(a.fcm)); c.stroke(); c.setLineDash([]);
  }
  const im = S.findIndex(f => f === hi0);
  c.beginPath(); c.arc(X(im), Y(hi0), eixos ? 9 : 7, 0, 7); c.fillStyle = '#fff'; c.fill();
  if (eixos) relTexto(c, `${a.fcx ?? hi0} máx.`, Math.min(X(im), gx + gw - 6), Y(hi0) - 22, { px: 26, peso: 700, al: X(im) > gx + gw - 90 ? 'right' : 'center' });
  c.restore();
}

function relZonas(c, a, x, y, w) {
  const Z = a.zonas, tot = Z.reduce((p, q) => p + q, 0);
  if (!tot) return;
  const cores = ['rgba(255,255,255,.16)', 'rgba(255,255,255,.28)', 'rgba(255,255,255,.44)', 'rgba(255,255,255,.70)', REL_COR.vivo];
  let cx = x;
  c.save();
  rr(c, x, y, w, 30, 15); c.clip();
  Z.forEach((s, i) => { const ww = (s / tot) * w; c.fillStyle = cores[i]; c.fillRect(cx, y, ww, 30); cx += ww; });
  c.restore();
  const col = w / 5;
  Z.forEach((s, i) => {
    const lx = x + i * col;
    c.beginPath(); c.arc(lx + 9, y + 70, 8, 0, 7); c.fillStyle = cores[i]; c.fill();
    relTexto(c, `Z${i + 1}`, lx + 26, y + 79, { px: 24, peso: 700 });
    relTexto(c, `${Math.round((s / tot) * 100)}% · ${fmtTempo(s)}`, lx, y + 118, { px: 23, peso: 500, cor: REL_COR.muted });
  });
}

function relQuebrar(c, texto, larg) {
  const L = []; let l = '';
  for (const p of texto.split(' ')) {
    const t = l ? l + ' ' + p : p;
    if (c.measureText(t).width > larg && l) { L.push(l); l = p; } else l = t;
  }
  if (l) L.push(l);
  return L;
}
const relRelevo = a => {
  if (a.subida == null || !a.km) return null;
  const m = a.subida / a.km;
  return { nome: m < 10 ? 'Plano' : m < 25 ? 'Ondulado' : 'Com subidas', sub: `subida total de ~${a.subida} m` };
};
const relZonaPrincipal = a => { if (!a.zonas) return null; const t = a.zonas.reduce((p, q) => p + q, 0), m = Math.max(...a.zonas); return { z: a.zonas.indexOf(m) + 1, pct: Math.round((m / t) * 100) }; };

function relTextos(a) { // frases curtas do relatório detalhado, só com o que dá para afirmar
  const out = [], P = a.parciais.filter(p => p.m >= 900);
  if (P.length >= 2) {
    const p1 = P[0].pace, p2 = P[P.length - 1].pace, dif = p2 - p1;
    if (dif > 10) out.push(`O ritmo foi caindo: o 1º km saiu em ${fmtPace(p1)} e o último em ${fmtPace(p2)} por km.`);
    else if (dif < -10) out.push(`Você acelerou: o 1º km saiu em ${fmtPace(p1)} e o último em ${fmtPace(p2)} por km.`);
    else out.push(`Ritmo estável, entre ${fmtPace(Math.min(...P.map(p => p.pace)))} e ${fmtPace(Math.max(...P.map(p => p.pace)))} por km.`);
  }
  if (a.fcm != null) {
    const z = relZonaPrincipal(a);
    out.push(`Batimentos: média de ${a.fcm} bpm${a.fcx != null ? ` e máximo de ${a.fcx}` : ''}${z && z.pct >= 40 ? `; ${z.pct}% do tempo na zona ${z.z} do relógio` : ''}.`);
  }
  return out;
}

const relAviso = (c, x, y, w, texto) => {
  relCartao(c, x, y, w, 190);
  c.font = '500 30px Inter, system-ui, sans-serif';
  relQuebrar(c, texto, w - 80).slice(0, 3).forEach((l, i) => relTexto(c, l, x + 40, y + 72 + i * 42, { px: 30, peso: 500, cor: REL_COR.muted }));
};
const SEM_DETALHE = 'Esta corrida não tem o detalhe do relógio. Importe o arquivo FIT na corrida para ver percurso, batimentos e ritmo por trecho.';

// ---------- formatos ----------
function relStories(c, a, W, H) {
  relCabecalho(c, a, 215);
  relHero(c, a, 520, 350);
  relStats(c, relItensBase(a), REL_M, 585, W - 2 * REL_M);
  const gx = REL_M, gw = W - 2 * REL_M, topo = 790;
  if (!a.d) { relAviso(c, gx, topo, gw, SEM_DETALHE); return; }
  const esq = 500, dir = gw - esq - 24, hG = 650, mini = (hG - 48) / 3;
  if (a.rota) {
    relCartao(c, gx, topo, esq, hG);
    relTexto(c, 'Percurso', gx + 38, topo + 74, { px: 40, peso: 700 });
    relTexto(c, a.retorno ? `ida de ${relKm1(a.retorno.m)} km e volta de ${relKm1((a.km || 0) * 1000 - a.retorno.m)} km` : 'trajeto registrado pelo GPS', gx + 38, topo + 118, { px: 27, peso: 500, cor: REL_COR.muted });
    relRota(c, a, gx + 60, topo + 190, esq - 120, hG - 250, { esp: 8 });
  } else relAviso(c, gx, topo, esq, 'Sem GPS nesta corrida.');
  const dx = gx + esq + 24;
  relCartao(c, dx, topo, dir, mini);
  relRotulo(c, 'Batimentos', dx + 36, topo + 60);
  const fw = relTexto(c, String(a.fcm ?? '—'), dx + 36, topo + 136, { px: 96, num: true });
  relTexto(c, 'bpm', dx + 36 + fw + 8, topo + 136, { px: 28, peso: 600, cor: REL_COR.muted });
  if (a.fcx != null) relTexto(c, `máx. ${a.fcx}`, dx + 36, topo + mini - 20, { px: 26, peso: 500, cor: REL_COR.muted });
  const y2 = topo + mini + 24;
  relCartao(c, dx, y2, dir, mini);
  relRotulo(c, 'Cadência', dx + 36, y2 + 60);
  const cw = relTexto(c, String(a.cad ?? '—'), dx + 36, y2 + 140, { px: 96, num: true });
  if (a.cad != null) relTexto(c, 'ppm', dx + 36 + cw + 8, y2 + 140, { px: 28, peso: 600, cor: REL_COR.muted });
  const y3 = y2 + mini + 24, rel = relRelevo(a);
  relCartao(c, dx, y3, dir, mini);
  relRotulo(c, 'Relevo', dx + 36, y3 + 60);
  relTexto(c, rel ? rel.nome : '—', dx + 36, y3 + 140, { px: 84, num: true });
  if (rel) relTexto(c, rel.sub, dx + 36, y3 + mini - 26, { px: 26, peso: 500, cor: REL_COR.muted });
  const yp = topo + hG + 26, hp = 400;
  if (a.ritmo.length >= 2) {
    relCartao(c, gx, yp, gw, hp);
    relTexto(c, 'Ritmo a cada 250 m', gx + 38, yp + 74, { px: 40, peso: 700 });
    relTexto(c, 'barra mais alta = mais rápido', gx + 38, yp + 116, { px: 27, peso: 500, cor: REL_COR.muted });
    relBarrasRitmo(c, a, gx + 38, yp + 110, gw - 76, hp - 126);
  }
}

function relFeed(c, a, W, H) {
  relCabecalho(c, a, 130);
  relHero(c, a, 390, 280);
  const gw = W - 2 * REL_M, topo = 440, hc = 560;
  if (a.rota) {
    relCartao(c, REL_M, topo, gw, hc);
    relRota(c, a, REL_M + 90, topo + 70, gw - 180, hc - 150, { esp: 10 });
  } else relAviso(c, REL_M, topo, gw, a.d ? 'Sem GPS nesta corrida.' : SEM_DETALHE);
  relStats(c, relItensBase(a), REL_M, topo + hc + 50, gw, { px: 120, alt: 160 });
}

function relPoster(c, a, W, H) {
  relTexto(c, relDataTxt(a).toUpperCase(), W / 2, 150, { px: 30, peso: 600, cor: REL_COR.muted, ls: 8, al: 'center' });
  if (a.rota) relRota(c, a, 150, 230, W - 300, 640, { rotulos: false, esp: 14, brilho: true });
  else relTexto(c, 'sem GPS nesta corrida', W / 2, 600, { px: 32, peso: 500, cor: REL_COR.muted, al: 'center' });
  const val = a.km != null ? fmtKm(a.km) : a.t != null ? fmtTempo(a.t) : '—';
  const w = relTexto(c, val, REL_M - 6, 1170, { px: 270, num: true });
  if (a.km != null) relTexto(c, 'km', REL_M - 6 + w + 18, 1170, { px: 80, num: true, cor: REL_COR.vivo });
  const l = [a.t != null && fmtTempo(a.t), a.pace && `${fmtPace(a.pace)} /km`].filter(Boolean).join('   ·   ');
  relTexto(c, l, REL_M, 1260, { px: 36, peso: 600, cor: REL_COR.muted });
}

// o formato detalhado monta uma lista de seções e soma as alturas antes de desenhar
function relSecoesDetalhado(c, a, W) {
  const gw = W - 2 * REL_M, S = [];
  const relevo = relRelevo(a), zp = relZonaPrincipal(a);
  const itens = [
    a.fcm != null && { rot: 'Batimentos', val: String(a.fcm), un: 'bpm', sub: a.fcx != null ? `máx. ${a.fcx} bpm` : null },
    a.cad != null && { rot: 'Cadência', val: String(a.cad), un: 'ppm', sub: a.d?.passo_mm ? `passada de ${(a.d.passo_mm / 1000).toFixed(2).replace('.', ',')} m` : null },
    relevo && { rot: 'Relevo', val: relevo.nome, sub: relevo.sub },
    a.d?.te != null && { rot: 'Efeito de treino', val: Number(a.d.te).toFixed(1).replace('.', ','), sub: a.d.tea != null ? `anaeróbico ${Number(a.d.tea).toFixed(1).replace('.', ',')}` : null },
    a.d?.carga != null && { rot: 'Carga', val: String(a.d.carga), sub: 'pico do treino' }
  ].filter(Boolean);
  if (itens.length) {
    const lin = Math.ceil(itens.length / 2), hh = 210;
    S.push({ h: lin * hh + (lin - 1) * 24, desenhar: (cx, y) => {
      const lw = (gw - 24) / 2;
      itens.forEach((it, k) => {
        const x = REL_M + (k % 2) * (lw + 24), yy = y + Math.floor(k / 2) * (hh + 24);
        const larg = k === itens.length - 1 && k % 2 === 0 ? gw : lw; // último sozinho na linha ocupa a largura toda
        relCartao(cx, x, yy, larg, hh, 44);
        relRotulo(cx, it.rot, x + 34, yy + 54);
        const w = relTexto(cx, it.val, x + 34, yy + 148, { px: it.un || it.val.length < 6 ? 96 : 70, num: true });
        if (it.un) relTexto(cx, it.un, x + 34 + w + 8, yy + 148, { px: 28, peso: 600, cor: REL_COR.muted });
        if (it.sub) relTexto(cx, it.sub, x + 34, yy + 190, { px: 24, peso: 500, cor: REL_COR.muted });
      });
    } });
  }
  c.font = '500 31px Inter, system-ui, sans-serif';
  const frases = relTextos(a).map(t => relQuebrar(c, t, gw - 80));
  if (frases.length) {
    const nl = frases.reduce((p, q) => p + q.length, 0);
    S.push({ h: 130 + nl * 44 + (frases.length - 1) * 18, desenhar: (cx, y) => {
      relCartao(cx, REL_M, y, gw, 130 + nl * 44 + (frases.length - 1) * 18);
      relTexto(cx, 'Como foi o treino', REL_M + 38, y + 76, { px: 40, peso: 700 });
      let yy = y + 130;
      frases.forEach(ls => { ls.forEach(l => { relTexto(cx, l, REL_M + 38, yy, { px: 31, peso: 500, cor: '#D8D8DC' }); yy += 44; }); yy += 18; });
    } });
  }
  const P = a.parciais;
  if (P.length) {
    const rh = 96;
    S.push({ h: 150 + P.length * rh + 30, desenhar: (cx, y) => {
      relCartao(cx, REL_M, y, gw, 150 + P.length * rh + 30);
      relTexto(cx, 'Parciais por quilômetro', REL_M + 38, y + 76, { px: 40, peso: 700 });
      relRotulo(cx, 'km', REL_M + 38, y + 136); relRotulo(cx, 'ritmo', REL_M + 190, y + 136); relRotulo(cx, 'FC', REL_M + gw - 38, y + 136, 'right');

  if (a.fcs) {

    } });

// desenha o relatório no canvas informado e devolve o formato usado
function renderizarRelatorio(cv, a, fmt) {
  const W = fmt.w, medida = document.createElement('canvas').getContext('2d');
  let H = fmt.h, secoes = null;
  if (fmt.id === 'detalhado') {
    secoes = relSecoesDetalhado(medida, a, W);
    H = 770 + secoes.reduce((p, s) => p + s.h + 28, 0) + 140;
  }
  cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  if (fmt.id === 'painel') { quadroPainel(c, a, Infinity); return { W, H }; }
  relFundo(c, W, H);
  if (fmt.id === 'stories') relStories(c, a, W, H);
  else if (fmt.id === 'feed') relFeed(c, a, W, H);
  else if (fmt.id === 'poster') relPoster(c, a, W, H);
  else {
    relDetalhado(c, a, W);
    let y = 770;
    for (const s of secoes) { s.desenhar(c, y); y += s.h + 28; }
    relTexto(c, `${a.fonte ? 'Dados do relógio · arquivo ' + a.fonte.toUpperCase() + ' · ' : ''}gerado no app Wellness`, W / 2, H - 70, { px: 24, peso: 500, cor: REL_COR.muted, al: 'center' });
  }
  return { W, H };
}

/* ==========================================================================
   PAINEL AO VIVO — 1.7.0: relatório animado (vídeo) e imagem final no mesmo desenho.
   Uma função desenha o quadro para qualquer instante t; o PNG é o último quadro,
   o vídeo é gravado do próprio canvas (MediaRecorder), sem internet.
   Corrida com GPS: percurso + cartão a cada km. Sem GPS (esteira): barras de ritmo por km.
   ========================================================================== */
const pnSuave = t => { const s = t * t * (3 - 2 * t); return 0.35 * t + 0.65 * s; };
const pnLim = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function pnMedia(arr, i, r) {
  let s = 0, n = 0;
  for (let k = i - r; k <= i + r; k++) { const v = arr[k]; if (ehNum(v)) { s += v; n++; } }
  return n ? s / n : null;
}
const PN_CARTAO = { x: 72, y: 143, w: 936, h: 720 };
const PN_CHIP = { w: 360, h: 140 };

function prepararPainel(a) {
  if (a.painel) return a.painel;
  const d = a.d, n = d.vel.length, p = a.passo, total = a.dist[n];
  const vSeg = Math.min(3.2, 13 / Math.max(total / 1000, 0.5));
  const segs = [], marcas = [];
  for (let k = 1; k * 1000 <= total - 100; k++) marcas.push(k * 1000);
  let t = 0.5, m = 0;
  for (const alvo of [...marcas, total]) {
    const dur = Math.max(1.2, ((alvo - m) / 1000) * vSeg);
    segs.push({ t0: t, t1: t + dur, m0: m, m1: alvo }); t += dur; m = alvo;
    if (alvo !== total) { segs.push({ t0: t, t1: t + 1.7, m0: alvo, m1: alvo, km: alvo / 1000 }); t += 1.7; }
  }
  const fimCorrida = t;
  const P = { n, p, total, segs, fimCorrida, duracao: fimCorrida + 4, marcas, kmTotal: Math.max(1, Math.round(total / 1000)) };
  P.estado = ts => {
    if (ts >= fimCorrida) return { dm: total, final: true };
    if (ts < segs[0].t0) return { dm: 0 };
    const s = segs.find(q => ts >= q.t0 && ts < q.t1) || segs[segs.length - 1];
    if (s.km) return { dm: s.m0, hold: s.km, k: (ts - s.t0) / (s.t1 - s.t0), ts: ts - s.t0, dur: s.t1 - s.t0 };
    return { dm: s.m0 + (s.m1 - s.m0) * pnSuave(pnLim((ts - s.t0) / (s.t1 - s.t0), 0, 1)) };
  };
  // séries suavizadas, uma por bloco de 5 s
  P.fc = a.fcs ? a.fcs.map((_, i) => pnMedia(a.fcs, i, 2)) : null;
  P.pace = d.vel.map((_, i) => { const v = pnMedia(d.vel, i, 6); return v > 30 ? 100000 / v : null; });
  P.cad = d.cad ? d.cad.map((_, i) => pnMedia(d.cad, i, 3)) : null;
  const pv = P.pace.filter(ehNum).sort((x, y) => x - y);
  P.paceLo = pv.length ? Math.max(150, pv[Math.floor(pv.length * 0.04)] - 15) : 240;
  P.paceHi = pv.length ? Math.min(900, pv[Math.floor(pv.length * 0.96)] + 15) : 520;
  const fv = P.fc ? P.fc.filter(ehNum) : [];
  P.fcLo = fv.length ? Math.floor((Math.min(...fv) - 5) / 10) * 10 : 100;
  P.fcHi = fv.length ? Math.ceil((Math.max(...fv) + 5) / 10) * 10 : 200;
  P.tempoEm = m => (a.tempoEm ? a.tempoEm(m) : (m / total) * n * p);
  // percurso: geometria dentro do cartão e distância de cada ponto
  const R = a.rota;
  if (R && R.length >= 2) {
    const bx = PN_CARTAO.x + 46, by = PN_CARTAO.y + 96, bw = PN_CARTAO.w - 92, bh = PN_CARTAO.h - 96 - 46;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const q of R) { x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    const s = Math.min(bw / Math.max(x1 - x0, 1), bh / Math.max(y1 - y0, 1));
    const ox = bx + (bw - (x1 - x0) * s) / 2, oy = by + (bh - (y1 - y0) * s) / 2;
    P.pts = R.map(q => [ox + (q.x - x0) * s, oy + (y1 - q.y) * s]);
    P.D = R.map(q => a.dist[Math.min(q.i, n)]);
    for (let j = 1; j < P.D.length; j++) if (P.D[j] < P.D[j - 1]) P.D[j] = P.D[j - 1];
    P.pos = m => {
      const D = P.D, L = P.pts;
      if (m <= D[0]) return { x: L[0][0], y: L[0][1], j: 0, f: 0 };
      let j = 0;
      while (j < D.length - 2 && D[j + 1] < m) j++;
      const f = D[j + 1] > D[j] ? pnLim((m - D[j]) / (D[j + 1] - D[j]), 0, 1) : 0;
      return { x: L[j][0] + (L[j + 1][0] - L[j][0]) * f, y: L[j][1] + (L[j + 1][1] - L[j][1]) * f, j, f };
    };
    const fim = P.pts[P.pts.length - 1], perto = (x, y) => Math.hypot(x - fim[0], y - fim[1]) < 58;
    let arr = total; // metro em que a bolinha chega de vez ao fim (para esconder marcador sobreposto)
    for (let m2 = total; m2 > 0; m2 -= 5) { const q = P.pos(m2); if (!perto(q.x, q.y)) { arr = m2; break; } }
    P.arr = arr;
    P.mk = marcas.map(m2 => { const q = P.pos(m2); return { m: m2, x: q.x, y: q.y, some: perto(q.x, q.y) }; });
    // canto do cartão do km: o que menos cobre o traço e a bolinha
    const caixa = { x: PN_CARTAO.x + 20, y: PN_CARTAO.y + 20, w: PN_CARTAO.w - 40, h: PN_CARTAO.h - 40 };
    const cantos = [[caixa.x + caixa.w - PN_CHIP.w, caixa.y + 66], [caixa.x, caixa.y + 66], [caixa.x + caixa.w - PN_CHIP.w, caixa.y + caixa.h - PN_CHIP.h], [caixa.x, caixa.y + caixa.h - PN_CHIP.h]];
    P.chipPos = marcas.map(m2 => {
      const q = P.pos(m2); let melhor = null;
      cantos.forEach(([cx, cy]) => {
        let custo = 0;
        for (let j = 0; j < P.pts.length - 1; j++) for (let u = 0; u < 6; u++) {
          const x = P.pts[j][0] + (P.pts[j + 1][0] - P.pts[j][0]) * u / 6, y = P.pts[j][1] + (P.pts[j + 1][1] - P.pts[j][1]) * u / 6;
          if (x > cx - 28 && x < cx + PN_CHIP.w + 28 && y > cy - 28 && y < cy + PN_CHIP.h + 28) custo++;
        }
        if (q.x > cx - 50 && q.x < cx + PN_CHIP.w + 50 && q.y > cy - 50 && q.y < cy + PN_CHIP.h + 50) custo += 10000;
        if (!melhor || custo < melhor.custo) melhor = { custo, cx, cy };
      });
      return [melhor.cx, melhor.cy];
    });
  }
  a.painel = P;
  return P;
}

function pnSerie(c, vals, x, y, w, h, lo, hi, inv, frac, cor, esp) {
  const n = vals.length;
  if (n < 2) return;
  const X = i => x + (i / (n - 1)) * w, Y = v => y + (inv ? (v - lo) / (hi - lo) : 1 - (v - lo) / (hi - lo)) * h;
  const tracar = () => {
    c.beginPath(); let abre = false;
    vals.forEach((v, i) => { if (!ehNum(v)) { abre = false; return; } const yy = pnLim(Y(v), y - 4, y + h + 4); if (abre) c.lineTo(X(i), yy); else { c.moveTo(X(i), yy); abre = true; } });
  };
  c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
  tracar(); c.lineWidth = esp * 0.7; c.strokeStyle = 'rgba(255,255,255,.17)'; c.stroke();
  if (frac > 0) {
    c.beginPath(); c.rect(x - 10, y - 20, w * frac + 10, h + 40); c.clip();
    tracar(); c.lineWidth = esp; c.strokeStyle = cor; c.stroke();
  }
  c.restore();
}

function pnChip(c, a, P, e, idx) {
  const par = a.parciais[idx];
  if (!par) return;
  const al = pnLim(Math.min(e.ts / 0.25, (e.dur - e.ts) / 0.25), 0, 1), [cx, cy0] = P.chipPos[idx], cy = cy0 + (1 - al) * 14;
  c.save(); c.globalAlpha = al;
  rr(c, cx, cy, PN_CHIP.w, PN_CHIP.h, 30); c.fillStyle = 'rgba(10,10,12,.78)'; c.fill();
  relCartao(c, cx, cy, PN_CHIP.w, PN_CHIP.h, 30);
  relTexto(c, `KM ${idx + 1}`, cx + 28, cy + 44, { px: 22, peso: 600, cor: REL_COR.muted, ls: 4 });
  let xx = cx + 28;
  xx += relTexto(c, fmtPace(par.pace), xx, cy + 112, { px: 70, num: true, cor: REL_COR.vivo }) + 8;
  xx += relTexto(c, '/km', xx, cy + 112, { px: 26, peso: 500, cor: REL_COR.muted }) + 22;
  if (par.fc != null) {
    xx += relTexto(c, String(par.fc), xx, cy + 112, { px: 70, num: true }) + 8;
    relTexto(c, 'bpm', xx, cy + 112, { px: 26, peso: 500, cor: REL_COR.muted });
  }
  c.restore();
}

function pnPercurso(c, a, P, e, kmAtual) {
  const pt = P.pts, atual = P.pos(e.dm), sw = 16;
  relRotulo(c, 'Percurso', PN_CARTAO.x + 32, PN_CARTAO.y + 62);
  relTexto(c, `KM ${kmAtual} DE ${P.kmTotal}`, PN_CARTAO.x + PN_CARTAO.w - 32, PN_CARTAO.y + 62, { px: 24, peso: 600, cor: REL_COR.txt, ls: 5, al: 'right' });
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  const linha = ate => { c.beginPath(); pt.slice(0, ate + 1).forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); };
  linha(pt.length - 1); c.lineWidth = sw; c.strokeStyle = 'rgba(255,255,255,.14)'; c.stroke();
  if (e.dm > 0) {
    const parcial = () => { c.beginPath(); pt.slice(0, atual.j + 1).forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.lineTo(atual.x, atual.y); };
    c.shadowColor = 'rgba(255,90,54,.85)'; c.shadowBlur = 34; parcial(); c.lineWidth = sw; c.strokeStyle = REL_COR.vivo; c.stroke();
    c.shadowBlur = 0; parcial(); c.stroke();
  }
  c.restore();
  const [sx, sy] = pt[0];
  c.beginPath(); c.arc(sx, sy, sw * 1.3, 0, 7); c.fillStyle = '#070708'; c.fill(); c.lineWidth = sw * 0.6; c.strokeStyle = REL_COR.vivo; c.stroke();
  P.mk.forEach((q, i) => {
    const al = q.some ? 1 - pnLim((e.dm - P.arr) / 40, 0, 1) : 1;
    if (al <= 0) return;
    c.save(); c.globalAlpha = al;

function pnMime() {

async function gravarPainelMp4(cv, a, aoProgresso) {
  if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') return null;
  const w = 720, h = 1280, fps = 30, P = prepararPainel(a);
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42002a', 'avc1.42001f']) {
    const c = { codec, width: w, height: h, bitrate: 6000000, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' };
    try { const r = await VideoEncoder.isConfigSupported(c); if (r.supported) { cfg = r.config || c; break; } } catch { /* tenta o próximo */ }
  }
  if (!cfg) return null;
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d'), amostras = []; let avcC = null, erro = null;
  const enc = new VideoEncoder({
    output: (ch, meta) => { const d = new Uint8Array(ch.byteLength); ch.copyTo(d); if (meta && meta.decoderConfig && meta.decoderConfig.description) avcC = new Uint8Array(meta.decoderConfig.description.buffer ? meta.decoderConfig.description : meta.decoderConfig.description); amostras.push({ data: d, key: ch.type === 'key' }); },
    error: e => { erro = e; }
  });
  enc.configure(cfg);
  const dur = P.duracao + 0.5, total = Math.round(dur * fps);
  for (let i = 0; i < total; i++) {
    if (erro) throw erro;
    c.setTransform(w / 1080, 0, 0, w / 1080, 0, 0);
    quadroPainel(c, a, Math.min(i / fps, P.duracao));
    const q = new VideoFrame(cv, { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) });
    enc.encode(q, { keyFrame: i % 30 === 0 }); q.close();
    while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 4));
    if (i % 3 === 0) { if (aoProgresso) aoProgresso(i / total); await new Promise(r => setTimeout(r, 0)); }
  }
  await enc.flush(); enc.close();
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (erro || !avcC || !amostras.length) return null;
  return montarMp4({ w, h, fps, avcC, amostras });
}

// reproduz a animação no canvas e grava; devolve o vídeo (ou null se o navegador não grava)
async function gravarPainel(cv, a, aoProgresso) {
  const P = prepararPainel(a), mime = pnMime();
  cv.width = 720; cv.height = 1280;
  const c = cv.getContext('2d');
  let rec = null, fluxo = null; const partes = [];
  if (mime) {
    fluxo = cv.captureStream(30);
    rec = new MediaRecorder(fluxo, { mimeType: mime, videoBitsPerSecond: 6000000 });
    rec.ondataavailable = ev => { if (ev.data && ev.data.size) partes.push(ev.data); };
    rec.start(250);
  }
  const t0 = performance.now(), dur = P.duracao + 0.5;
  await new Promise(ok => {
    const passo = () => {
      const t = (performance.now() - t0) / 1000;
      c.setTransform(720 / 1080, 0, 0, 720 / 1080, 0, 0);
      quadroPainel(c, a, Math.min(t, P.duracao));
      if (aoProgresso) aoProgresso(Math.min(1, t / dur));
      if (t < dur) requestAnimationFrame(passo); else ok();
    };
    requestAnimationFrame(passo);
  });
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (!rec) return null;
  await new Promise(ok => { rec.onstop = ok; rec.stop(); });
  fluxo.getTracks().forEach(tr => tr.stop());
  return new Blob(partes, { type: mime.split(';')[0] });
}

   RELATÓRIO DA ACADEMIA — 1.7.0: imagem da sessão (duração, volume, FC, zonas e exercícios).
   Séries e cargas vêm do app; FC e zonas vêm do arquivo do relógio importado na sessão.

const ACAD_ZONAS_COR = ['#3F3F46', '#52525B', '#71717A', '#C4C4CC', '#FF9A82', '#FF5A36'];
const fmtMilhar = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function analisarAcademia(s) {
  const rel = s.sessao_relogio || null;
  const det = rel && rel.detalhe && Array.isArray(rel.detalhe.fc) && rel.detalhe.fc.filter(ehNum).length > 10 ? rel.detalhe : null;
  const vol = L => L.reduce((p, r) => p + (ehNum(r.reps) && ehNum(r.carga_kg) ? r.reps * r.carga_kg : 0), 0);
  const doDia = S.registros.filter(r => r.tipo !== 'corrida' && r.dia === s.dia);
  const hoje_ = doDia.filter(r => r.data === s.data);
  const antes = doDia.filter(r => r.data < s.data).map(r => r.data).sort().pop() || null;
  const ant = antes ? agrupar(doDia.filter(r => r.data === antes), r => r.exercicio) : [];
  const antMap = new Map(ant);
  const ordem = ordemNoDia(s.dia);
  const exs = agrupar(hoje_, r => r.exercicio).sort(([x], [y]) => ordem(x) - ordem(y)).map(([id, L]) => {
    L = L.slice().sort((a, b) => a.serie - b.serie);
    const reps = L.map(r => (r.duracao_s != null ? r.duracao_s : r.reps));
    const unidade = L[0].duracao_s != null ? ' s' : '';
    const cs = L.map(r => r.carga_kg).filter(v => ehNum(v) && v > 0);
    const carga = !cs.length ? '' : new Set(cs).size === 1 ? fmtKg(cs[0]) : `${fmtKg(Math.min(...cs))}–${fmtKg(Math.max(...cs))}`;
    const sub = (new Set(reps).size === 1 ? `${L.length} × ${reps[0]}${unidade}` : reps.join(' · ') + unidade) + (carga ? ` · ${carga} kg` : '');
    const v = vol(L), va = antMap.has(id) ? vol(antMap.get(id)) : 0;
    return { id, nome: nomeExercicio(id), sub, delta: v > 0 && va > 0 ? Math.round((v / va - 1) * 100) : null };
  });
  return {
    s, rel, det, exs, antes, series: hoje_.length, volume: vol(hoje_),
    dur: ehNum(rel?.duracao_s) ? rel.duracao_s : s.duracao_s, hora: rel?.inicio || s.inicio,
    fcs: det ? det.fc : null, passo: det?.passo || PASSO_DETALHE, fcm: rel?.fc_media ?? null, fcx: rel?.fc_max ?? null,
    zonas: det && Array.isArray(det.zonas) && det.zonas.length >= 6 && det.zonas.some(v => v > 0) ? det.zonas.slice(0, 6) : null

}

      c.font = '600 27px Inter, system-ui, sans-serif';
      let nome = e.nome; const lim = lw - 52;
      while (c.measureText(nome).width > lim && nome.length > 4) nome = nome.slice(0, -2);
      if (nome !== e.nome) nome = nome.trimEnd() + '…';
      relTexto(c, nome, x + 26, yy2 + 46, { px: 27, peso: 600 });
      relTexto(c, e.sub, x + 26, yy2 + 85, { px: 22, peso: 500, cor: REL_COR.muted });
      if (e.delta != null) relTexto(c, e.delta > 0 ? `+${e.delta}%` : e.delta < 0 ? `${e.delta}%` : '=', x + lw - 26, yy2 + 85, { px: 28, peso: 700, al: 'right', cor: e.delta > 0 ? REL_COR.vivo : REL_COR.muted });
      c.restore();
    });
  }
  relTexto(c, `${A.rel?.fonte ? 'FC e zonas do relógio · ' : ''}gerado no app Wellness`, W / 2, H - 70, { px: 24, peso: 500, cor: REL_COR.muted, al: 'center' });
}

async function abrirRelatorioAcademia(sessao) {
  const dlg = $('#dlg');
  const fechar = () => (dlg.close ? dlg.close() : dlg.removeAttribute('open'));
  const A = analisarAcademia(sessao);
  UI.relAberto = { k: 'a', id: sessao.id }; salvarUI();
  dlg.addEventListener('close', () => { UI.relAberto = null; salvarUI(); }, { once: true });
  const tela = h('canvas', { class: 'rel-tela', role: 'img', 'aria-label': 'Prévia do relatório da academia' });
  const nome = `wellness-academia-${pad2(partes(sessao.data)[2])}-${pad2(partes(sessao.data)[1])}-${partes(sessao.data)[0]}.png`;
  const blob = () => new Promise(ok => tela.toBlob(ok, 'image/png'));
  const salvar = async () => {
    const b = await blob(); if (!b) return toast('Não consegui gerar a imagem.', 'erro');
    const url = URL.createObjectURL(b), link = h('a', { href: url, download: nome });
    document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Imagem baixada');
  };
  const compartilhar = async () => {
    const b = await blob(); if (!b) return toast('Não consegui gerar a imagem.', 'erro');
    try { await navigator.share({ files: [new File([b], nome, { type: 'image/png' })], title: 'Academia ' + fmtData(sessao.data) }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('Não consegui compartilhar. Use "Salvar imagem".', 'erro'); }
  };
  const podeCompartilhar = typeof navigator.canShare === 'function' && typeof navigator.share === 'function'
    && navigator.canShare({ files: [new File([new Blob(['x'])], 'x.png', { type: 'image/png' })] });
  dlg.replaceChildren(h('div', null,
    h('h2', null, 'Relatório da academia'),
    h('p', { class: 'muted' }, `${cap(NOMES_DIA[diaDaSemana(sessao.data)])}, ${fmtData(sessao.data)} · ${A.series} séries`),
    h('div', { class: 'acoes' },
      h('button', { type: 'button', class: 'btn-pri', onclick: salvar }, 'Salvar imagem'),
      podeCompartilhar && h('button', { type: 'button', onclick: compartilhar }, 'Compartilhar')),
    A.det ? null : h('p', { class: 'muted' }, 'Importe o arquivo do relógio na sessão (Editar sessão) para incluir batimentos e zonas.'),
    tela,
    h('button', { type: 'button', class: 'btn-bloco', onclick: fechar }, 'Fechar')));
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  await relFontes(); renderizarAcademia(tela, A);
}

/* ==========================================================================
   VOLTAR ONDE ESTAVA — 1.7.2: o Android pode descartar o app em segundo plano (ao compartilhar no
   Instagram, por exemplo). A tela, o dia, o mês do calendário, a rolagem e o relatório aberto
   ficam guardados e voltam ao reabrir. Só navegação: nenhum dado do treino passa por aqui.
   ========================================================================== */
const CHAVE_UI = 'treino.ui.v1';
function salvarUI() {
  try {
    localStorage.setItem(CHAVE_UI, JSON.stringify({ t: Date.now(), aba: UI.aba, data: UI.dataManual ? UI.data : null, dataManual: !!UI.dataManual,
      diaId: UI.diaId, histModo: UI.histModo, calMes: UI.calMes, y: Math.round(window.scrollY), rel: UI.relAberto || null }));
  } catch { /* sem espaço: segue sem guardar */ }
}
function lerUI() {
  try {
    const o = JSON.parse(localStorage.getItem(CHAVE_UI) || 'null');
    return o && typeof o === 'object' && Date.now() - o.t < 12 * 3600 * 1000 ? o : null;
  } catch { return null; }
}
function restaurarUI(o) {
  if (!o) return;
  if (['hoje', 'historico', 'ajustes'].includes(o.aba)) UI.aba = o.aba;
  if (o.dataManual && typeof o.data === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.data)) { UI.data = o.data; UI.dataManual = true; }
  UI.diaId = o.diaId && diaPorId(o.diaId) ? o.diaId : diaPadrao(UI.data);
  if (o.histModo === 'data' || o.histModo === 'ex') UI.histModo = o.histModo;
  if (o.calMes) UI.calMes = o.calMes;
}
function reabrirRelatorio(rel) {
  if (!rel) return;
  if (rel.k === 'c') { const r = S.registros.find(x => x.tipo === 'corrida' && x.data === rel.data); if (r) abrirRelatorioCorrida(r); }
  else if (rel.k === 'a') { const s = Sessao.finalizadas().find(x => x.id === rel.id); if (s) abrirRelatorioAcademia(s); }
}

/* ==========================================================================
   APP (navegação, inicialização, service worker)
   ========================================================================== */
function irPara(aba, secao) { UI.aba = aba; UI.secaoAlvo = secao || null; render(false); }

function render(manterScroll = true) {
  const y = window.scrollY;
  salvarUI();
  let conteudo;
  if (!S.plano) conteudo = viewBoasVindas();
  else if (UI.aba === 'historico') conteudo = viewHistorico();
  else if (UI.aba === 'ajustes') conteudo = viewAjustes();
  else conteudo = viewHoje();
  $('#main').replaceChildren(...[].concat(conteudo).filter(Boolean));
  $('#nav').hidden = !S.plano;
  for (const b of document.querySelectorAll('#nav button')) {
    const on = b.dataset.aba === UI.aba;
    b.classList.toggle('ativo', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
  desenharBarraSessao();
  Timer.desenhar();
  if (UI.secaoAlvo) {
    const alvo = document.getElementById(UI.secaoAlvo);
    UI.secaoAlvo = null;
    if (alvo) { alvo.scrollIntoView({ block: 'start' }); return; }
  }
  window.scrollTo(0, manterScroll ? y : 0);
  if (UI.rolarProximo) { UI.rolarProximo = false; rolarProximo(); }
}

// Primeiro exercício ainda não concluído (no início do treino inclui aquecimento e corrida);
// sem nenhum pendente, vai até o aviso de treino completo.
function rolarProximo() {
  if (UI.aba !== 'hoje') return;
  const cards = [...document.querySelectorAll('#main .card.ex:not(.concluido)')];
  const comSeries = cards.filter(c => !c.classList.contains('aquec') && !c.classList.contains('corrida'));
  const algumFeito = document.querySelector('#main .card.ex.concluido, #main .serie.feita');
  const alvo = (algumFeito ? comSeries[0] : cards[0]) || document.querySelector('#main .aviso.ok');
  if (!alvo) return;
  const top = alvo.getBoundingClientRect().top + window.scrollY - 14 - (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topo-h')) || 0);
  const suave = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({ top: Math.max(0, top), behavior: suave ? 'smooth' : 'auto' });
}

// 1.3.0: a versão nova se instala sozinha. O app recarrega na hora se não houver treino, descanso
// nem folha aberta; senão mostra o aviso e recarrega na próxima vez que você voltar ao app.
function podeRecarregar() { return !Sessao.emAndamento() && !Timer.st && !$('#dlg').open; }
function registrarSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const tinhaControle = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    UI.swReg = reg;
    reg.update().catch(() => {}); // procura versão nova a cada abertura
    const oferecer = w => { UI.swEsperando = w; $('#banner-update').hidden = false; medirTopo(); };
    if (reg.waiting && navigator.serviceWorker.controller) oferecer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) oferecer(w); });
    });
  }).catch(e => console.warn('service worker', e));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!tinhaControle && !UI.atualizando) return; // primeira instalação: a página já é a versão atual
    if (UI.atualizando || podeRecarregar()) location.reload();
    else { UI.atualizacaoPendente = true; $('#banner-update').hidden = false; medirTopo(); }
  });
}

let ultimaChecagemSW = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (UI.atualizacaoPendente && podeRecarregar()) { location.reload(); return; } // versão nova esperando o fim do treino
  if (Tela.quer) Tela.manter(true);
  Timer.tick();
  Sessao.tick();
  Sessao.verificarEsquecida();
  if (!UI.dataManual && UI.data !== hoje()) { UI.data = hoje(); UI.diaId = diaPadrao(UI.data); render(); } // virou o dia com o app aberto
  if (UI.swReg && Date.now() - ultimaChecagemSW > 30 * 60 * 1000) { ultimaChecagemSW = Date.now(); UI.swReg.update().catch(() => {}); }
});

(function iniciar() {
  if (S.plano) {
    const v = validarPlano(S.plano);
    if (v.erros.length) { UI.planoInvalido = v.erros; S.plano = null; }
  }
  UI.diaId = diaPadrao(UI.data);
  const uiSalva = S.plano ? lerUI() : null;
  restaurarUI(uiSalva);
  let tScroll = 0; window.addEventListener('scroll', () => { clearTimeout(tScroll); tScroll = setTimeout(salvarUI, 400); }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') salvarUI(); });
  document.addEventListener('pointerdown', () => Som.desbloquear(), { passive: true });
  for (const b of document.querySelectorAll('#nav button')) b.addEventListener('click', () => irPara(b.dataset.aba));
  $('#timer .t-parar').addEventListener('click', () => Timer.parar());
  $('#btn-finalizar-topo').addEventListener('click', confirmarFinalizar);
  $('#btn-atualizar').addEventListener('click', () => {
    UI.atualizando = true;
    if (UI.swEsperando && UI.swEsperando.state === 'installed') UI.swEsperando.postMessage('pular-espera'); else location.reload();
  });
  if (Timer.st) {
    if (!Timer.st.inicio || Timer.decorrido() > Timer.st.max + 180) Timer.parar();
    else { Tela.manter(true); Timer.rodar(); }
  }
  if (Sessao.emAndamento()) Sessao.rodar(); // sessão em andamento sobrevive a fechar o app e reiniciar o celular
  render(false);
  if (uiSalva && uiSalva.y > 0) setTimeout(() => window.scrollTo(0, uiSalva.y), 60);
  if (uiSalva && uiSalva.rel) setTimeout(() => reabrirRelatorio(uiSalva.rel), 120);
  Sessao.verificarEsquecida();
  pedirPersistencia().then(() => { if (UI.aba === 'ajustes') render(); });
  registrarSW();
})();
</script>
